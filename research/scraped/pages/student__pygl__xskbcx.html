<script type="text/javascript">
    $(function () {
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: '../default/bindterm',
            cache: false,
            success: function (json) {
                $('#searchterm').combobox({
                    data: json,
                    method: 'get',
                    editable: false,
                    valueField: 'termcode',
                    textField: 'termname',
                    multiple: false,
                    onSelect: function () {
                        GetList();
                    }
                });
                GetList();
            }
        });

    })

    function GetList() {
        var searchterm = $("#searchterm").combobox("getValue");
        if (searchterm != "") {
            GetList_ew();
        }
    }

    function GetList_ew() {
        var searchterm = $("#searchterm").combobox("getValue");
        if (searchterm == "") {
            $.messager.alert("提示", "请选择学期", "error");
            return;
        }

        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "py_kbcx_ew",
            data: { 'kblx': 'xs', 'termcode': searchterm },
            cache: false,
            success: function (data) {
                var html = "";
                $('#kb tbody').empty();
                $.each(data.rows, function (i, o) {
                    var z1 = '', z2 = '', z3 = '', z4 = '', z5 = '', z6 = '', z7 = '';
                    var c1 = '', c2 = '', c3 = '', c4 = '', c5 = '', c6 = '', c7 = '';
                    var re = /\[/g;
                    var re1 = /\]/g;
                    if (o.z1)
                        z1 = '<div class="C_kc_subject"><p>' + o.z1.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c1 = ' class="C_kc_rowspan"';
                    if (o.z2)
                        z2 = '<div class="C_kc_subject"><p>' + o.z2.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c2 = ' class="C_kc_rowspan"';
                    if (o.z3)
                        z3 = '<div class="C_kc_subject"><p>' + o.z3.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c3 = ' class="C_kc_rowspan"';
                    if (o.z4)
                        z4 = '<div class="C_kc_subject"><p>' + o.z4.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c4 = ' class="C_kc_rowspan"';
                    if (o.z5)
                        z5 = '<div class="C_kc_subject"><p>' + o.z5.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c5 = ' class="C_kc_rowspan"';
                    if (o.z6)
                        z6 = '<div class="C_kc_subject"><p>' + o.z6.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c6 = ' class="C_kc_rowspan"';
                    if (o.z7)
                        z7 = '<div class="C_kc_subject"><p>' + o.z7.replace(re, "<span>").replace(re1, '</span>') + '</p></div>'; c7 = ' class="C_kc_rowspan"';
                    html = '<tr>'
							+ '<td class="C_kc">' + o.mc + '</td>'
							+ '<td w="Monday"' + c1 + '>' + z1 + '</td>'
                            + '<td w="Tuesday"' + c2 + '>' + z2 + '</td>'
                            + '<td w="Wednesday"' + c3 + '>' + z3 + '</td>'
                            + '<td w="Thursday"' + c4 + '>' + z4 + '</td>'
                            + '<td w="Friday"' + c5 + '>' + z5 + '</td>'
                            + '<td w="Saturday"' + c6 + '>' + z6 + '</td>'
                            + '<td w="Sunday"' + c7 + '>' + z7 + '</td>'
                            + '</tr>';
                    $('#kb tbody').append(html);

                });
                $("td[w='" + data.week + "']").addClass("today");
                $("th[w='" + data.week + "']").addClass("today");
                $("td[w='" + data.week + "']").find("div").addClass("C_kc_today_subject").removeClass("C_kc_subject");
                var cells = [];
                for (var i = 0; i <= 7; i++) {
                    cells.push("z" + i);
                }
                mergeCells_table('kb', data, cells);
                $.each($(".C_kc_subject"), function (i, o) {
                    $(o).height($(o).parent().height() - 11);
                });
                $.each($(".C_kc_today_subject"), function (i, o) {
                    $(o).height($(o).parent().height() - 21);
                });
            },
            error: function (e) {

            }
        });
    }
    
    function dcword() {
        var termcode = $("#searchterm").combobox("getValue");
        if (searchterm != "") {
            var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
            var input1 = $("<input type='hidden' name='kblx' value='xs'>");
            var input2 = $("<input type='hidden' name='termcode' value='" + termcode + "'>");
            $("body").append(form); //将表单放置在web中
            form.append(input1);
            form.append(input2);
            form.attr("action", "dcword_kb");
            form.submit();
            $("#exportToExcelForm").remove();
        }
    }

    function doprint() {
        var height = ($(window).height()*0.9)+ "px"; 
        var width = ($(window).width())+ "px";
        var top = 0;
        var termcode = $("#searchterm").combobox("getValue");
        parent.layer.open({
                type: 2,
                title: false,
                area: [width, height],
                content: ["/student/pygl/doprint_kb?kblx=xs&termcode="+termcode],
                shadeClose: true,
                closeBtn: 1,
                end: function () {
                            
                }
            });

//            $("#exportToExcelForm").remove();
//        }
    }
</script>
