    <div>
      
<script type="text/javascript">
    function downkcml(type) {
        location.href = 'qxkczml_down?type=' + type;
    }
</script>
<style type="text/css">
    .kcml_wrap
    {
        padding: 20px;
    }
    .kcml_tip
    {
        font-size: 14px;
        color: #555;
        line-height: 26px;
        margin-bottom: 20px;
    }
    .kcml_cards
    {
        display: flex;
        flex-wrap: wrap;
    }
    .kcml_card
    {
        width: 400px;
        box-sizing: border-box;
        border: 1px solid #E7EEF0;
        border-radius: 6px;
        background: #fafcfd;
        text-align: center;
        padding: 35px 20px;
        margin: 0 20px 20px 0;
    }
    .kcml_card .kcml_icon
    {
        display: block;
        width: 56px;
        height: 56px;
        line-height: 56px;
        margin: 0 auto 15px auto;
        border-radius: 50%;
        background: #e8f3fb;
        color: #2d7cb2;
        font-size: 24px;
        font-weight: bold;
    }
    .kcml_card .kcml_title
    {
        display: block;
        font-size: 16px;
        color: #333;
        line-height: 26px;
        margin-bottom: 20px;
    }
    .kcml_card a.kcml_btn
    {
        display: inline-block;
        padding: 7px 28px;
        border-radius: 4px;
        background: #2d7cb2;
        color: #fff;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
    }
    .kcml_card a.kcml_btn:hover
    {
        background: #23658f;
    }
</style>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
                <div class="title">
                    全校课程总目录</div>
            </div>
            <div class="kcml_wrap">
                <div class="kcml_tip"></div>
                <div class="kcml_cards">
                    <div class="kcml_card">
                        <span class="kcml_icon">博</span> <span class="kcml_title">北京化工大学博士研究生课程目录</span>
                        <a class="kcml_btn" href="javascript:void(0)" onclick="downkcml('bs')">下载</a>
                    </div>
                    <div class="kcml_card">
                        <span class="kcml_icon">硕</span> <span class="kcml_title">北京化工大学硕士研究生课程目录</span>
                        <a class="kcml_btn" href="javascript:void(0)" onclick="downkcml('ss')">下载</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
