<body>
    <div>
      
<script type="text/javascript">
    $(function () {
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: '../default/bindterm',
            cache: false,
            success: function (json) {
                $('#searchterm').combobox({
                    data: json,
                    method: 'get',
                    editable: false,
                    valueField: 'termcode',
                    textField: 'termname',
                    multiple: false,
                    onSelect: function () {
                        GetList();
                    }
                });
                GetList();
            }
        });
    })

    function GetList() {
        var searchterm = $("#searchterm").combobox("getValue");
        if (searchterm == "") {
            $.messager.alert("提示", "请选择学期", "error");
            return;
        }
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: 'py_kbcx_yw',
            queryParams: { 'termcode': searchterm },
            loadMsg: '正在加载....',
            columns: [[
                { field: 'bjid', hidden: true },
                { field: 'kcbh', title: '课程编号', width: 80 },
                { field: 'kcmc', title: '课程名称', width: 100 },
                { field: 'bjmc', title: '班级名称', width: 110 },
                { field: 'kcxf', title: '学分', width: 30 },
                { field: 'jdid', title: '阶段', width: 30 },
                { field: 'rkjsxm', title: '任课教师', width: 40 },
                { field: 'ksz', title: '起讫周', width: 40,
                    formatter: function (value, row, index) {
                        return row.ksz + '-' + row.jsz;
                    }
                },
                { field: 'sjms', title: '时间', width: 150,
                    formatter: function (value, row, index) {
                        return row.lxfs + ' ' + value;
                    }
                },
                { field: 'dz', title: '上课地点', width: 80 }
//                { field: 'xkrs', title: '选课人数', width: 40 }
            ]],

            pagination: false, //分页控件 
            fitColumns: true,
            striped: true,
            rownumbers: true, //行号
            singleSelect: false, //是否单选 
            onLoadSuccess: function (data) {

            }
        });
        //设置分页控件 
    }

    function dcexcel() {
        var termcode = $("#searchterm").combobox("getValue");
        if (searchterm != "") {
            var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
            var input2 = $("<input type='hidden' name='termcode' value='" + termcode + "'>");
            $("body").append(form); //将表单放置在web中
            form.append(input2);
            form.attr("action", "dcexcel_yw");
            var columns = [{ Code: 'kcbh', Name: '课程编号', 'DataType': 'S', Width: 30, Hidden: false },
                        { Code: 'kcmc', Name: '课程名称', 'DataType': 'S', Width: 50, Hidden: false },
                        { Code: 'bjmc', Name: '班级名称', 'DataType': 'S', Width: 50, Hidden: false },
                        { Code: 'kcxf', Name: '学分', 'DataType': 'S', Width: 20, Hidden: false },
                        { Code: 'jdid', Name: '阶段', 'DataType': 'S', Width: 20, Hidden: false },
                        { Code: 'rkjsxm', Name: '任课教师', 'DataType': 'S', Width: 30, Hidden: false },
                        { Code: 'ksz', Name: '开始周', 'DataType': 'S', Width: 20, Hidden: false },
                        { Code: 'jsz', Name: '结束周', 'DataType': 'S', Width: 20, Hidden: false },
                        { Code: 'sjms', Name: '时间', 'DataType': 'S', Width: 50, Hidden: false },
                        { Code: 'dz', Name: '上课地点', 'DataType': 'S', Width: 50, Hidden: false },
                        { Code: 'xkrs', Name: '选课人数', 'DataType': 'S', Width: 20, Hidden: false }
                        ];
            var jsonfield = JSON.stringify(columns);
            var input = $("<input type='hidden' name='excel'>");
            input.attr("value", jsonfield);
            form.append(input);
            form.submit();
            $("#exportToExcelForm").remove();
        }
    }
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
                &nbsp;学期：<input id="searchterm" name="searchterm" style="height: 36px;" />&nbsp;
                
                <button type="button" class="btn-default marginleft20" onclick="GetList()">
                    <span class="icon icon-magnifier"></span>查询</button>
                <button id="lnksubmit" type="button" class="btn-primary floatright" onclick="dcexcel()">
                    导出数据</button>
                
            </div>
            <table id="dg">
            </table>
        </div>
    </div>
</div>

    </div>
