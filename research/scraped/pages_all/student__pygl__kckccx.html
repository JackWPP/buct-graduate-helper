    <div>
      

<script type="text/javascript">
    $(function () {
        GetList();
    });

    function GetList() {
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: 'kckccx_list',
            queryParams: {},
            loadMsg: '正在加载....',
            columns: [[
                { field: 'termname', title: '学期', width: 60 },
                { field: 'kcbh', title: '课程编号', width: 50 },
                { field: 'kcmc', title: '课程名称', width: 80 },
                { field: 'dz', title: '考试地点', width: 50 },
                { field: 'ksrs', title: '考生人数', width: 30 },
                { field: 'ksrq', title: '考试日期', width: 30 },
                { field: 'kssj', title: '考试时间', width: 30 },
                { field: 'zwh', title: '座位号', width: 30 }
            ]],
            pagination: false, //分页控件 
            fitColumns: true,
            striped: true,
            rownumbers: true, //行号
            singleSelect: true, //是否单选 
            onLoadSuccess: function (data) {
                var s = $("#dg").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row td[field!=action]');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            },
            onLoadError: function () {
                $.messager.alert("提示", "加载失败", "error");
            }
        });
    }


    function getRowIndex(target) {
        var tr = $(target).closest('tr.datagrid-row');
        return parseInt(tr.attr('datagrid-row-index'));
    }

    
</script>
