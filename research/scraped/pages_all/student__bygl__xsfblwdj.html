<body>
    <div>
      
<script type="text/javascript" language="javascript">
    $(function () {
        binddata();
    });
    function binddata() {
        var height = $(window).height() * 0.9;
        $("#dg").datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: "xwlwdjlist",
            fitColumns: true,
            striped: true,
            columns: [[
            { field: 'ck', title: '', width: 100, checkbox: true },
            { field: 'lwmc', title: '论文题目', width: 200 },
                {
                    field: 'zlwlx', title: '论文类型', width: 80, formatter: function (value, row, index) {
                        if (value == "1") {
                            return "期刊论文";
                        } else {
                            return "会议论文";
                        }
                }
            },
            { field: 'kwmc', title: '发表刊物', width: 150 },
            { field: 'cn', title: '刊物型号', width: 90 },
            { field: 'kwqh', title: '刊物期号', width: 90 },
            { field: 'dyzz', title: '第一作者', width: 90 },
            { field: 'dspm', title: '导师排名', width: 60 },
            { field: 'fblbmc', title: '发表类别', width: 80 },
            { field: 'slqkmc', title: '收录情况', width: 80 },
            //{ field: 'shlmc', title: '审核状态', width: 80 }
            ]],
            onLoadSuccess: function (data) {
                if (data.total > 0) {
                    $(".div").css({ "display": "none" });
                }
                else {
                    $(".div").css({ "display": "" });
                }
            },
            onCheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onCheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            }
        });
        controlEmpty();
    }
    function reload() {
        $("#dg").datagrid('reload');
        controlEmpty();
    }
    function controlEmpty() {
        var rows = $("#dg").datagrid('getRows');
        if (rows.length > 0) {
            $(".div").css({ "display": "none" });
        }
        else {
            $(".div").css({ "display": "" });
        }
    }
    function openaddWindow() {
        var width = $(window).width() * 0.7;
        var height = $(window).height() + $(window).height() * 0.05;
        parent.$("#w").window({
            title: '添加论文登记',
            iconCls: 'icon-table_add',
            height: height,
            width: width,
            modal: true,
            maximizable: false,
            href: "../bygl/xwlwdjadd",
            onClose: function () {
                if (parent.isreload == "1") {
                    reload();
                }
            }
        });
        parent.$("#w").window('center');
    }
    function openeditWindow() {
        var checkedRow = $("#dg").datagrid('getChecked');
        if (checkedRow.length == 0) {
            $.messager.alert("提示", "请选择要查看的论文！", "info");
            return;
        }
        var id = $("#dg").datagrid('getChecked')[0].id;
        var width = $(window).width() * 0.7;
        var height = $(window).height() + $(window).height() * 0.05;
        parent.$("#w").window({
            title: '编辑论文登记',
            iconCls: 'icon-table_edit',
            height: height,
            width: width,
            modal: true,
            maximizable:false,
            href: "../bygl/xwlwdjedit?id=" + id,
            onClose: function () {
                if (parent.isreload == "1") {
                    reload();
                }
            }
        });
        parent.$("#w").window('center');
    }
    function deletebyid() {
        var rows = $("#dg").datagrid('getChecked');
        if (rows.length == 0) {
            $.messager.alert("提示", "请选择要删除的论文！", "info");
            return;
        }
        var tiparray = [];
        $.each(rows, function (index, row) {
            if (row.dqzt != 0 && row.dqzt != "" && row.dqzt != null && row.dqzt != undefined) {
                tiparray.push("【" + row.lwmc + "】");
            }
        });
        if (tiparray.length > 0) {
            $.messager.alert("提示", tiparray.join(",") + "已被审核，无法删除！", "info");
            return;
        }
        $.messager.confirm("提示", "确定要删除选择的论文", function (isok) {
            if (isok) {
                var array = [];
                $.each(rows, function (index, item) {
                    array.push(item.id);
                });
                var idstr = array.join(",");
                $.post('delxsfblwdjByid', { ids: idstr, dotype:'1' }, function (data) {
                    if (data.jg == "1") {
                        reload();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }, 'json');
            }
        });
    }
    function dcsj() {
        var form = $("<form action='xs_dclwcg' method='post'></form>");
        $("body").append(form);
        form.submit();
    }
    function word() {
        var rows = $("#dg").datagrid('getChecked');
        if (rows.length == 0) {
            $.messager.alert("提示", "请选择要打印的论文！", "error");
            return;
        }
        $.post("checkwordmb", function (data) {
            if (data.sign == "1") {
                var idarray = [];
                $.each(rows, function (index, row) {
                    idarray.push(row.id);
                });
                var idstr = idarray.join(",");
                var form = $("<form action='worddy' method='post'></form>");
                var input = $("<input type='hidden' value='" + idstr + "' name='ids'/>")
                form.append(input);
                $("body").append(form);
                form.submit();
            }
            else {
                $.messager.alert('提示', data.msg, "info");
            }
        }, 'json')
       
    }

    function fanhui() {
        window.history.back();
    }

    function biaoji() {
        var rows = $("#dg").datagrid('getChecked');
        if (rows.length == 0) {
            $.messager.alert("提示", "请选择要标记的论文！", "error");
            return;
        }
        var idarray = new array();
        $.each(rows, function (index, row) {
            idarray.push(row.id);
        });
        var idstr = idarray.join(",");

        $.ajax({
            type: 'post',
            url: "zqkh_cxtj",
            dataType: "json",
            data: { 'json': idstr },
            cache: false,
            success: function (json) {
                
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                $.messager.alert("提示", msg, "error");
            }
        });
        
    }
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
                <button id="btn-fh" type="button" onclick="fanhui()" class="btn-primary floatright">
                    返回
                </button>
                
                <button id="btn-dcsj" type="button" class="btn-primary floatright marginright20" onclick="dcsj()">
                    导出
                </button>
                <button id="btn-del" type="button" class="btn-primary floatright marginright20" onclick="deletebyid()">
                    删除
                </button>
                <button id="btn-edite" type="button" class="btn-primary floatright marginright20" onclick="openeditWindow()">
                    编辑
                </button>
                <button id="btn-add" type="button" class="btn-primary floatright marginright20" onclick="openaddWindow()">
                    新增
                </button>
                

            </div>
            <table id="dg">
            </table>
            <div class="div" style="height: 150px; border-top: 0px solid">
                <div style="width: 95%; text-align: center; border: 0px; margin-top: 5%; font-family: 宋体;
                    position: absolute">
                    暂无数据！
                </div>
            </div>
        </div>
    </div>
</div>
