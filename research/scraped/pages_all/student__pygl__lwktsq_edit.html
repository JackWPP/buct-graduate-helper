    <div>
      
<script type="text/javascript">
    $(function () {
        onInite();

    });
    function onInite() {
        var id = $("#hfid").val();
        $.ajax({
            type: 'get',
            dataType: "json", //返回json格式的数据
            url: "lwktsq_edit_load",
            data: { 'id': id },
            cache: false,
            success: function (data) {
                var info = data.info;
                var sfht = info.sfht
                shlxx(data.shl);
                $('#ff').form('load', info);
                if ("1" == "0") {
                    $.messager.alert("提示", "当前时间无法进行开题申请！", "error");
                    $('#btnsubmit').hide();
                    $('#btnsave').hide();

                  return;
        }
                //GetList();
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }


    function shlxx(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    shz = false;
                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    if (shz) {
                        html += '<div class="step_sm_item step_sm_processing"><span class="name">' + o.shlmc + '</span> <span class="time">审核中…</span>';
                        shz = false;
                    } else {
                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                '  </li>';
        })
        $("#step_sm").html(html);
    }






    function ktbg_save(zt) {
        var form = $("#ff");
        var isValid = $("#ff").form('enableValidation').form('validate');
        if (!isValid) {
            $.messager.progress('close'); // hide progress bar while the form is invalid
            return isValid;
        }

        var info = $('#ff').serializeObject();
        var tsxx = "保存";
        if (zt == "0")
            tsxx = "提交";
        var jsonObject = JSON.stringify(info);
        $("#ff").ajaxSubmit({
            method: 'post',
            url: "lwktsq_edit_save",
            dataType: "json",
            data: { 'json': jsonObject, 'zt': zt },
            cache: false,
            success: function (json) {
                if (json.jg == "0") {
                    if (json.msg) {
                        $.messager.alert("提示", json.msg, "error");
                    } else {
                        $.messager.alert("提示", tsxx + "出错", "error");
                    }
                }
                else if (json.jg == "1") {
                    $("#hfid").val(json.id);
                    onInite();
                    $.messager.alert("提示", tsxx + "成功");
                }
                else if (json.jg == "2") {
                    window.location.reload();
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                if (msg == "") {
                    $.messager.alert("提示", e.responseText, "error");
                }
                else {
                    $.messager.alert("提示", msg, "error");
                }
            }
        });
    }

    function ktbg_tj() {
        $.messager.confirm("提示", "提交后无法修改，确定要提交？", function (isok) {
            if (isok) {
                $('#hfkyxg').val("0");
                ktbg_save('0');
                $('#btnsave').hide();
                $('#btnsubmit').hide();
            }
        })
    }

</script>
<div class="Slayout">
    <div class="container">
        <div class="header_area">
            <div class="step_sm_view">
                <ul id="step_sm" class="step_sm">
                </ul>
            </div>
            <div class="floatright" style="padding-top: 8px;">
                    <input type="hidden" id="hfkyxg" value="1" />
                    <button id="btnsave" type="button" class="btn-primary  marginright20" onclick="ktbg_save()">
                        保存
                    </button>
                    <button id="btnsubmit" type="button" class="btn-primary marginright20" onclick="ktbg_tj()">
                        提交
                    </button>
            </div>
        </div>
        <div class="block">
            <div class="block-box">
                <form id="ff" method="post">
                    <table cellpadding="0" cellspacing="0" class="basictable">
                        <tr>
                            <td style="width: 150px; text-align: right" class="bg">
                                论文题目：
                            </td>
                            <td colspan="3">
                                <input id="hfid" name="id" type="hidden" value=""/>
                                <input id="txtlwtm" name="lwtm" type="text" class="easyui-textbox" style="width: 80%"
                                       data-options="required:true" />
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
        </div>
    </div>
