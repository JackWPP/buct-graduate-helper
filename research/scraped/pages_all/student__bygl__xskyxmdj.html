<script type="text/javascript" language="javascript">
    $(function () {
        binddata();
    });
    function binddata() {
        var height = $(window).height() * 0.9;
        $("#dg").datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: "xskyxmdj_list",
            fitColumns: true,
            striped: true,
            columns: [[
            { field: 'ck', title: '', width: 100, checkbox: true },
            { field: 'xmmc', title: '成果名称', width: 240 },
            { field: 'hprq', title: '时间', width: 120 },
            { field: 'pm', title: '本人排序', width: 90 },
            { field: 'ktjb', title: '级别', width: 100 },
            { field: 'wcr', title: '完成人', width: 120 },
            { field: 'bz', title: '备注', width: 180 }
            //{ field: 'shlmc', title: '审核状态', width: 80 }
            ]],
            onLoadSuccess: function (data) {
                if (data.total > 0) {
                    $(".div").css({ "display": "none" });
                }
                else {
                    $(".div").css({ "display": "" });
                }
            },
            onCheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onCheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            }
        });
        controlEmpty();
    }
    function reload() {
        $("#dg").datagrid('reload');
        controlEmpty();
    }
    function controlEmpty() {
        var rows = $("#dg").datagrid('getRows');
        if (rows.length > 0) {
            $(".div").css({ "display": "none" });
        }
        else {
            $(".div").css({ "display": "" });
        }
    }
    function OpenKyxmwin(title, id) {
        var icon = "";
        if (id == undefined) {
            icon = "icon-table_add";
        }
        else {
            icon = "icon-table_edit";
        }
        $("#content").css("display", "");
//        onselect(0);
        $("#kyxmwin").window({
            top: 20,
            title: title,
            width: 750,
            height: 520,
            iconCls: icon,
            modal: true,
            onOpen: function () {
                if (id != "") {
                    $.post("xskyxmdj_model", { id: id }, function (data) {
//                        onselect($("#sfzl").combobox('getValue'));
                        if (data != null) {
                            $('#ff').form('load', data);
                            if (data.zt == 0) {
                                $("#editTip").css({ "display": "none" });
                                $("#btn-save").linkbutton("enable");
                            }
                            else {
                                $("#editTip").css({ "display": "" });
                                //$("#btn-save").attr("disabled", "disabled");
                                $('#btn-save').linkbutton('disable');
                            }
                            if (data.fjmc == "") {
                                $("#sfscfj").text("");
                            }
                            else {
                                $("#sfscfj").text("已上传！");
                            }
                        }
                        else {
                            $("#editTip").css({ "display": "none" });
                            $("#btn-save").linkbutton("enable");
                        }
                    }, "json");
                }
            },
            onClose: function () {
                $("#id").val("");
                $("#xh").val("");
                $("#ff").form("reset");
            }
        });
        $("#kyxmwin").window("open");
        $("#kyxmwin").window("hcenter");
    }
    function editByid() {
        var row = $('#dg').datagrid('getChecked');
        if (row.length == 0) {
            $.messager.alert('提示', '请选择要编辑的科研项目！', 'info');
            return;
        }
        OpenKyxmwin('编辑科研项目', row[0].id);
    }
    function closewin() {
        $("#kyxmwin").window("close");
    }
//    function onselect(newValue, oldValue) {
//        if (newValue == "1") {
//            $("#spzlh").show();
//            $("#spzlhbox").show();
//        }
//        else {
//            $("#spzlh").hide();
//            $("#zlh").textbox('setValue', '');
//            $("#spzlhbox").hide();
//        }
//    }
    function submitForm() {
        var arraydata = $("#ff").serializeArray();
        var jsonobj = {};
        $.each(arraydata, function (index, item) {
            jsonobj[item.name] = item.value;
        });
        if (jsonobj.id == "") {
            jsonobj.id = 0;
        }
        var jsondata = JSON.stringify(jsonobj);
        if ($("#ff").form('enableValidation').form('validate')) {
            $("#ff").ajaxSubmit({
                url: "xskyxmdj_save",
                method: "post",
                dataType: 'json',
                data: { datajson: jsondata },
                success: function (data) {
                    if (data.sign == "1") {
                        closewin();
                        reload();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }
            })
        }
    }
    function deletekycg() {
        var rows = $("#dg").datagrid("getChecked");
        if (rows.length == 0) {
            $.messager.alert('提示', '请选择要删除的科研项目！', 'info');
            return;
        }
        var tiparray = [];
        $.each(rows, function (index, row) {
            if (row.dqzt != 0 && row.dqzt != "" && row.dqzt != null && row.dqzt != undefined) {
                tiparray.push("【" + row.cgmc + "】");
            }
        });
        if (tiparray.length > 0) {
            $.messager.alert("提示", tiparray.join(",") + "已被审核，无法删除！", "info");
            return;
        }
        $.messager.confirm("提示", "确定要删除选择的科研项目？", function (isok) {
            if (isok) {
                var idarray = [];
                $.each(rows, function (index, row) {
                    idarray.push(row.id);
                });
                var idstr = idarray.join(',');
                $.post("deletekyxmbyid", { id: idstr }, function (data) {
                    if (data.flag == "1") {
                        reload();
                    }
                    else {
                        $.messager.alert('提示', data.msg, 'error');
                    }
                }, "json");
            }
        });

    }
    function dcsj() {
        var form = $("<form action='xs_dckyxm' method='post'></form>");
        $("body").append(form);
        form.submit();
    }

    function fanhui() {
        window.history.back();
    }
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
                <button id="btn-fh" type="button" onclick="fanhui()" class="btn-primary floatright">
                    返回
                </button>
                <button id="btn-dcsj" type="button" class="btn-primary floatright marginright20" onclick="dcsj()">
                    导出
                </button>
                <button id="btn-del" type="button" class="btn-primary floatright marginright20" onclick="deletekycg()">
                    删除
                </button>
                <button id="btn-edite" type="button" class="btn-primary floatright marginright20"
                        onclick="editByid()">
                    编辑
                </button>
                <button id="btn-add" type="button" class="btn-primary floatright marginright20" onclick="OpenKyxmwin('新增科研成果')">
                    新增
                </button>
            </div>
            <table id="dg">
            </table>
            <div class="div" style="height: 150px; border-top: 0px solid">
                <div style="width: 95%; text-align: center; border: 0px; margin-top: 5%; font-family: 宋体;
                    position: absolute">
                    暂无数据！
                </div>
            </div>
        </div>
    </div>
</div>
<div id="kyxmwin" class="easyui-window" data-options="modal:true,closed:true" >
    <div id="content" style="display:none;">
        <form id="ff" method="post">
        <div style="margin: 0px auto; width: 700px;">
            <table class="basictable">
                <tr>
                    <td class="bg" style="width: 30%">
                        成果名称:
                    </td>
                    <td colspan="3">
                        <input id="xmmc" name="xmmc" class="easyui-textbox" data-options="width:'350',required:true,missingMessage:'成果名称不能为空！'" />
                        <input id="id" name="id" type="hidden" />
                        <input id="xh" name="xh" type="hidden" />
                    </td>
                </tr>
                <tr>
                    <td class="bg">
                        时间:
                    </td>
                    <td width="30%">
                        <input id="hprq" name="hprq" class="easyui-datebox" data-options="width:'90%',required:true,missingMessage:'时间不能为空！'" />
                    </td>
                    <td class="bg">
                        本人排序:
                    </td>
                    <td width="30%">
                        <select id="pm" name="pm" class="easyui-combobox" data-options="width:'120',editable: false,required:true,missingMessage:'本人排序不能为空！'">
                            <option value="">请选择</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="bg">
                        级别:
                    </td>
                    <td width="30%">
                        <input id="ktjb" name="ktjb" class="easyui-combobox" data-options="width:'120',required:true,editable: false,valueField:'dm',textField:'dmmc',data:[{&quot;tabletype&quot;:&quot;&quot;,&quot;dm&quot;:&quot;&quot;,&quot;dmmc&quot;:&quot;请选择&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;1&quot;,&quot;dmmc&quot;:&quot;国家级&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;2&quot;,&quot;dmmc&quot;:&quot;省部级&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;3&quot;,&quot;dmmc&quot;:&quot;其他&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null}]"/>
                    </td>
                    <td class="bg">
                        完成人:
                    </td>
                    <td width="30%">
                        <input id="wcr" name="wcr" class="easyui-textbox" data-options="width:'120',required:true,missingMessage:'完成人不能为空！'"/>
                    </td>
                </tr>
                <tr>
                    <td class="bg">
                        备注:
                    </td>
                    <td colspan="3">
                        <input id="bz" name="bz" class="easyui-textbox" data-options="multiline:true,width:'100%',height:100" />
                    </td>
                </tr>
                <tr>
                    <td class="bg">

                        附件:
                    </td>
                    <td colspan="3">
                        
                         <input id="kyfj" name="kyfj" class="easyui-filebox" style="width:200px;" data-options="buttonAlign: 'left',prompt:'未选择任何文件',buttonText:'选择文件'" />
                        <label id="sfscfj" style="color: Red"></label>
                    </td>
                </tr>
            </table>
            <div style="width: 100%; margin: 20px auto">
                <span id="editTip" style="color: Red; display: none">已审核,无法编辑！ </span>
                <div style="float: right">
                    <a class="easyui-linkbutton" id="btn-save" data-options="iconCls:'icon-save'" onclick="submitForm()">
                        保存</a>&nbsp;&nbsp; <a class="easyui-linkbutton" id="btn-cancle" data-options="iconCls:'icon-qx'"
                            onclick="closewin()">取消</a>
                </div>
            </div>
        </div>
        </form>
    </div>
</div>
