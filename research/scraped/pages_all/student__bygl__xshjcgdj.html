<script type="text/javascript" language="javascript">
    $(function () {
        $("#kycgwin").window("close");
        binddata();
    });
    function binddata() {
        var height = $(window).height() * 0.9;
        $("#dg").datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            autoRowHeight: false,
            url: "hjqklist",
            fitColumns: true,
            striped:true,
            columns: [[
            { field: 'ck', title: '', width: 100, checkbox: true },
            { field: 'jlmc', title: '奖励名称', width: 260 },
            { field: 'jljbmc', title: '奖励级别', width: 150 },
            { field: 'jldjmc', title: '奖励等级', width: 100 },
            { field: 'jllbmc', title: '奖励类别', width: 150 },
            { field: 'hjjs', title: '学生排名', width: 150 },
            { field: 'dspm', title: '导师排名', width: 150 },
            { field: 'zsh', title: '证书号', width: 150 },
            { field: 'hjrq', title: '获奖日期', width: 150 },
            { field: 'bjdw', title: '颁奖单位', width: 150 }
            //{ field: 'shlmc', title: '审核状态', width: 80 }
            ]],
            onLoadSuccess: function (data) {
                if (data.total > 0) {
                    $(".div").css({ "display": "none" });
                }
                else {
                    $(".div").css({ "display": "" });
                }
            },
            onCheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onCheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            }
        });
    }
    function reload() {
        $("#dg").datagrid('reload');
    }
    function OpenKycgwin(title, id) {
        var icon = "";
        if (id == undefined) {
            icon = "icon-table_add";
        }
        else {
            icon = "icon-table_edit";
        }
        $("#content").css("display", "inline");
        $("#kycgwin").window({
            top: 20,
            title: title,
            width: 800,
            height: 400,
            iconCls: icon,
            modal: true,
            onOpen: function () {
                if (id != "") {
                    $.post("gethjcgmodel", { id: id }, function (data) {
                        if (data != null) {
                            $('#ff').form('load', data);
                            if (data.shbj == "1") {
                                $("#editTip").css({ "display": "" });
                                $("#btn-save").linkbutton("disable");
                            }
                            else {
                                $("#editTip").css({ "display": "none" });
                                $("#btn-save").linkbutton("enable");
                            }
                            if (data.fjmc == "") {
                                $("#sfscfj").text("");
                            }
                            else {
                                $("#sfscfj").text("已上传！");
                            }
                        }
                        else {
                            $("#editTip").css({ "display": "none" });
                            $("#btn-save").linkbutton("enable");
                        }
                    }, "json");
                }
            },
            onClose: function () {
                $("#id").val("");
                $("#xh").val("");
                $("#ff").form("reset");
                $("#editTip").css({ "display": "none" });
                $("#btn-save").attr("disabled", false);
            }
        });
        $("#kycgwin").window("hcenter");
    }
    function edittByid() {
        var row = $('#dg').datagrid('getChecked');
        if (row.length == 0) {
            $.messager.alert('提示', '请选择要编辑的获奖成果！', 'info');
            return;
        }
        OpenKycgwin('编辑获奖成果', row[0].id);
    }
    function closewin() {
        $("#kycgwin").window("close");
    }
    function submitForm() {
        var arraydata = $("#ff").serializeArray();
        var jsonobj = {};
        $.each(arraydata, function (index, item) {
            jsonobj[item.name] = item.value;
        });
        if (jsonobj.id == "") {
            jsonobj.id = 0;
        }
        var jsondata = JSON.stringify(jsonobj);
        if ($("#ff").form('enableValidation').form('validate')) {
            $("#ff").ajaxSubmit({
                url: "savehjcgdjinfo",
                method: "post",
                dataType: 'json',
                data: { datajson: jsondata },
                success: function (data) {
                    if (data.sign == "1") {
                        closewin();
                        reload();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }
            })
        }
    }
    function deletekycg() {
        var rows = $("#dg").datagrid("getChecked");
        if (rows.length == 0) {
            $.messager.alert('提示', '请选择要删除的获奖成果！', 'info');
            return;
        }
        var tiparray = [];
        $.each(rows, function (index, row) {
            if (row.dqzt != 0 && row.dqzt != "" && row.dqzt != null && row.dqzt != undefined) {
                tiparray.push("【" + row.jlmc + "】");
            }
        });
        if (tiparray.length > 0) {
            $.messager.alert("提示", tiparray.join(",") + "已被审核，无法删除！", "info");
            return;
        }
        $.messager.confirm("提示", "确定要删除选择的获奖成果？", function (isok) {
            if (isok) {
                var idarray = [];
                $.each(rows, function (index, row) {
                    idarray.push(row.id);
                });
                var idstr = idarray.join(',');
                $.post("deletehjcgbyid", { id: idstr }, function (data) {
                    if (data.flag == "1") {
                        reload();
                    }
                    else {
                        $.messager.alert('提示', data.msg, 'error');
                    }
                }, "json");
            }
        });
    }
    function dcsj() {
        var form = $("<form action='xs_hjcgdj' method='post'></form>");
        $("body").append(form);
        form.submit();
    }

    function fanhui() {
        window.history.back();
    }
</script>
<div class="Slayout">

            <div class="Operating_area">
                <span style="color:Red">
                </span>

                <button id="btn-dcsj" type="button" class="btn-primary floatright marginright20" onclick="dcsj()">

                <button id="btn-del" type="button" class="btn-primary floatright marginright20" onclick="deletekycg()"><span class="icon icon-delete"></span>删除</button>

                    position: absolute">
                    暂无数据！
                </div>
            </div>
        </div>
    </div>
