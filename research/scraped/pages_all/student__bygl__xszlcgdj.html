<body>
    <div>
      

<script type="text/javascript" language="javascript">
    $(function () {
        binddata();
    });
    function binddata() {
        var height = $(window).height() * 0.9;
        $("#dg").datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            autoRowHeight: false,
            fitColumns: true,
            striped:true,
            url: "zlcglist",
            columns: [[
            { field: 'ck', title: '', width: 100, checkbox: true },
            { field: 'zlmc', title: '专利名称', width: 260 },
            { field: 'zlztmc', title: '专利状态', width: 150 },
            { field: 'zllxmc', title: '专利类型', width: 150 },
            { field: 'qsfmr', title: '参与角色', width: 150 },
            { field: 'dspm', title: '导师排名', width: 80 },
            { field: 'pm', title: '本人排名', width: 80 },
            { field: 'zlh', title: '专利申请号', width: 100 },
            { field: 'zsh', title: '专利授权号', width: 150 },
            { field: 'zlsqr', title: '成果署名单位', width: 100 },
            { field: 'sqny', title: '专利授权（颁证）年月', width: 150 }
            //{ field: 'shzt', title: '审核状态', width: 100}
            ]],
            onLoadSuccess: function (data) {
                if (data.total > 0) {
                    $(".div").css({ "display": "none" });
                }
                else {
                    $(".div").css({ "display": "" });
                }
            },
            onCheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onCheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheckAll: function (rows) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            },
            onUncheck: function (index, row) {
                var rows = $("#dg").datagrid('getChecked');
                if (rows.length > 1) {
                    $("#btn-edite").attr("disabled", "disabled");
                }
                else {
                    $("#btn-edite").attr("disabled", false);
                }
            }
        });
    }
    function reload() {
        $("#dg").datagrid('reload');
    }
    function OpenKycgwin(title, id) {
        var icon = "";
        if (id == undefined) {
            icon = "icon-table_add";
        }
        else {
            icon = "icon-table_edit";
        }
        $("#content").css("display", "inline");
        $("#kycgwin").window({
            top: 10,
            title: title,
            width: 800,
            height: 450,
            iconCls: icon,
            modal: true,
            onOpen: function () {
                if (id != "") {
                    $.post("getzlcgmodel", { id: id }, function (json) {
                        if (json.data != null) {
                            $('#ff').form('load', json.data);
                            if (json.isedit == "1") {
                                $("#editTip").css({ "display": "none" });
                                $("#btn-save").linkbutton("enable");
                            }
                            else {
                                $("#editTip").css({ "display": "" });
                                $("#btn-save").linkbutton("disable");
                            }
                            if (json.data.fjmc == "") {
                                $("#sfscfj").text("");
                            }
                            else {
                                $("#sfscfj").text("已上传！");
                            }
                        }
                        else {
                            $("#editTip").css({ "display": "none" });
                            $("#btn-save").linkbutton("enable");
                        }
                    }, "json");
                }
            },
            onClose: function () {
                $("#id").val("");
                $("#xh").val("");
                $("#ff").form("reset");
            }
        });
        $("#kycgwin").window("hcenter");
    }
    function edittByid() {
        var row = $('#dg').datagrid('getChecked');
        if (row.length == 0) {
            $.messager.alert('提示', '请选择要编辑的专利成果！', 'info');
            return;
        }
        OpenKycgwin('编辑专利成果', row[0].id);
    }
    function closewin() {
        $("#kycgwin").window("close");
    }
    function submitForm() {
        var arraydata = $("#ff").serializeArray();
        var jsonobj = {};
        $.each(arraydata, function (index, item) {
            jsonobj[item.name] = item.value;
        });
        if (jsonobj.id == "") {
            jsonobj.id = 0;
        }
        var jsondata = JSON.stringify(jsonobj);
        if ($("#ff").form('enableValidation').form('validate')) {
            $("#ff").ajaxSubmit({
                url: "savezlcgdjinfo",
                method: "post",
                dataType: 'json',
                data: { datajson: jsondata },
                success: function (data) {
                    if (data.sign == "1") {
                        closewin();
                        reload();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }
            })
        }
    }
    function deletekycg() {
        var rows = $("#dg").datagrid("getChecked");
        if (rows.length == 0) {
            $.messager.alert('提示', '请选择要删除的专利成果！', 'info');
            return;
        }
        var tiparray = [];
        $.each(rows, function (index, row) {
            if (row.shbj != 0 && row.shbj != "" && row.shbj != null && row.shbj != undefined) {
                tiparray.push("【" + row.zlmc + "】");
            }
        });
        if (tiparray.length > 0) {
            $.messager.alert("提示", tiparray.join(",") + "已被审核，无法删除！", "info");
            return;
        }
        $.messager.confirm("提示", "确定要删除选择的专利成果？", function (isok) {
            if (isok) {
                var idarray = [];
                $.each(rows, function (index, row) {
                    idarray.push(row.id);
                });
                var idstr = idarray.join(',');
                $.post("deletezlcgbyid", { id: idstr }, function (data) {
                    if (data.flag == "1") {
                        reload();
                    }
                    else {
                        $.messager.alert('提示', data.msg, 'error');
                    }
                }, "json");
            }
        });

    }
    function getWdatePickerData(target) {
        var handle = $.extend({}, $.fn.textbox.defaults.inputEvents, { click: function () {
            WdatePicker({ onpicking: function (dp) {
                var newvalue = dp.cal.getNewDateStr();
                $("#" + target).textbox('setValue', newvalue);
            }, dateFmt: 'yyyyMM'
            });
            WdatePicker({ onpicking: function (dp) {
                var newvalue = dp.cal.getNewDateStr();
                $("#" + target).textbox('setValue', newvalue);
            }, dateFmt: 'yyyyMM'
            });
        }
        })
        return handle;
    }
    function dcsj() {
        var form = $("<form action='xs_dczlcg' method='post'></form>");
        $("body").append(form);
        form.submit();
    }
    function fanhui() {
        window.history.back();
    }
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
                <button id="btn-fh" type="button" onclick="fanhui()" class="btn-primary floatright">
                    返回
                </button>
                <button id="btn-dcsj" type="button" class="btn-primary floatright marginright20" onclick="dcsj()">
                    导出
                </button>
                <button id="btn-del" type="button" class="btn-primary floatright marginright20" onclick="deletekycg()"><span class="icon icon-delete"></span>删除</button>
                <button id="btn-edite" type="button" class="btn-primary floatright marginright20" onclick="edittByid()">编辑</button>
                <button id="btn-add" type="button" class="btn-primary floatright marginright20" onclick="OpenKycgwin('新增专利成果')"><span class="icon icon-add"></span>新增</button>
            </div>
            <table id="dg">
            </table>
            <div class="div" style="height: 150px; border-top: 0px solid">
                <div style="width: 95%; text-align: center; border: 0px; margin-top: 5%; font-family: 宋体;
                    position: absolute">
                    暂无数据！
                </div>
            </div>
        </div>
    </div>
</div>
<div id="kycgwin">
    <div class="tabs_content" id="content" style="display:none">
        <form id="ff" method="post">
        <div style="margin: 0px auto; width: 700px; margin-top: 10px; border: 0px solid red">
            <table class="basictable">
                <tr>
                    <td class="bg" style="width:25%">
                        专利名称：
                    </td>
                    <td colspan="3">
                        <input id="zlmc" name="zlmc" class="easyui-textbox" data-options="width:'90%',required:true,missingMessage:'专利名称不能为空！'" />
                        <input id="id" name="id" type="hidden" />
                        <input id="xh" name="xh" type="hidden" />
                    </td>
                </tr>
                <tr>
                    <td width="20%" class="bg">
                        专利状态：
                    </td>
                    <td width="30%">
                        <input id="zlzt" name="zlzt" class="easyui-combobox" data-options="width:'90%',valueField:'dm',textField:'dmmc',data:[{&quot;tabletype&quot;:&quot;&quot;,&quot;dm&quot;:&quot;&quot;,&quot;dmmc&quot;:&quot;请选择&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;01&quot;,&quot;dmmc&quot;:&quot;专利发表论文&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;02&quot;,&quot;dmmc&quot;:&quot;已申请&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;03&quot;,&quot;dmmc&quot;:&quot;已申请并公开&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;04&quot;,&quot;dmmc&quot;:&quot;已授权&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null}]" />
                    </td>
                    <td width="20%" class="bg">
                        专利类型：
                    </td>
                    <td width="30%">
                        <input id="zllx" name="zllx" class="easyui-combobox" data-options="width:'90%',valueField:'dm',textField:'dmmc',data:[{&quot;tabletype&quot;:&quot;&quot;,&quot;dm&quot;:&quot;&quot;,&quot;dmmc&quot;:&quot;请选择&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;01&quot;,&quot;dmmc&quot;:&quot;发明专利&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;02&quot;,&quot;dmmc&quot;:&quot;实用新型专利&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null},{&quot;tabletype&quot;:null,&quot;dm&quot;:&quot;03&quot;,&quot;dmmc&quot;:&quot;外观设计专利&quot;,&quot;ywmc&quot;:null,&quot;othermc&quot;:null}]" />
                    </td>
                </tr>
                <tr>
                    <td width="20%" class="bg">
                        参与角色：
                    </td>
                    <td width="30%">
                        <input id="qsfmr" name="qsfmr" class="easyui-textbox" data-options="width:'90%'" />
                    </td>
                    <td width="20%" class="bg">
                        本人排名：
                    </td>
                    <td width="30%">
                        <select id="pm" name="pm" class="easyui-combobox" data-options="width:'90%'" validtype='ComboboxRequire["pm"]' invalidmessage="本人排名不能为空!">
                            <option value="">请选择</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="其他">其他</option> 
                        </select>
                    </td>
                </tr>
                 <tr>
                    <td width="20%" class="bg">
                        导师排名：
                    </td>
                    <td width="30%">
                        <select id="dspm" name="dspm" class="easyui-combobox" data-options="width:'90%'"  validtype='ComboboxRequire["dspm"]' invalidmessage="导师排名不能为空!">
                            <option value="">请选择</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="其他">其他</option> 
                        </select>
                    </td>
                    <td width="20%" class="bg">
                         专利申请号：
                    </td>
                    <td width="30%">
                        <input id="zlh" name="zlh" class="easyui-textbox" data-options="width:'90%'" />
                    </td>
                </tr>
                <tr>
                    <td width="20%" class="bg">
                        专利授权号：
                    </td>
                    <td width="30%">
                        <input id="zsh" name="zsh" class="easyui-textbox" data-options="width:'90%',required:true,missingMessage:'专利授权号不能为空！'" />
                    </td>
                    <td width="20%" class="bg">
                       成果署名单位：
                    </td>
                    <td width="30%">
                        <input id="zlsqr" name="zlsqr" class="easyui-textbox" data-options="width:'90%',required:true,missingMessage:'专利授权人不能为空！'" />
                    </td>
                </tr>
                <tr>
                    <td width="20%" class="bg">
                        专利授权（颁证）年月：
                    </td>
                    <td width="30%">
                        <input id="sqny" name="sqny" class="easyui-textbox" data-options="width:'90%',inputEvents:getWdatePickerData('sqny'),iconCls:'icon-date',required:true,missingMessage:'专利授权（颁证）年月不能为空！'" />
                    </td>
                    <td width="20%" class="bg">
                        专利申请年月：
                    </td>
                    <td width="30%">
                        <input id="zlsqrq" name="zlsqrq" class="easyui-textbox" data-options="width:'90%',inputEvents:getWdatePickerData('zlsqrq'),iconCls:'icon-date',required:true,missingMessage:'专利申请年月不能为空！'" />
                    </td>
                </tr>
                <tr>
                     <td class="bg">
附件:
                    </td>
                    <td colspan="3">
                       
                         <input id="zlfj" name="zlfj" class="easyui-filebox" style="width:200px;" data-options="buttonAlign: 'left',prompt:'未选择任何文件',buttonText:'选择文件'" />
                        <label id="sfscfj" style="color:Red"></label>
                    </td>
                </tr>
            </table>
            <div style="width: 100%; margin: 0px auto">
                <span id="editTip" style="color: Red; display: none">已审核,无法编辑！ </span>
                
                <div style="float: right">
                    <a class="easyui-linkbutton" id="btn-save" data-options="iconCls:'icon-save'"
                            onclick="submitForm()">保存</a>&nbsp;&nbsp;
                            <a class="easyui-linkbutton" id="btn-cancle" data-options="iconCls:'icon-qx'" onclick="closewin()">

        </div>
        </form>
    </div>
</div>
