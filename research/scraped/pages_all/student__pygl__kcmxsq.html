<script type="text/javascript">
    $(function () {
        Getlist();
        bindcjdz();
    });

    function bindcjdz() 
    {
        var sscolarr=[ { field: 'ck', title: '', width: 100, checkbox: true },
                { field: 'lbmc', title: '类别', width: 150 },
                { field: 'kscj', title: '考试成绩', width: 90,formatter:function(value,row,index){
                    var str="";
                    if(row.zdcj&&row.zgcj)
                        str=row.zdcj+"~"+row.zgcj;
                    else if(row.zdcj&&!row.zgcj)
                        str=row.zdcj+"(含)以上";
                    return str;
                } },
                { field: 'cjmc', title: '免修后成绩', width: 100},
                { field: 'sqcj', title: '我的考试成绩', width: 100 ,formatter:function(value,row,index){
                    var html="<input class='textbox' id='sqcj"+row.bh+"' style='width:100px'/>"
                    return html;
                }}];
        var bscolarr=[ { field: 'ck', title: '', width: 100, checkbox: true },
                { field: 'lbmc', title: '类别', width: 150 },
                { field: 'cjmc', title: '免修后成绩', width: 100}
                ];
        var col=undefined;
        if("2"=="1")
            col=bscolarr;
        else
            col=sscolarr;
        $("#dg").datagrid({
            width: 'auto',
            height: '350px',
            scrollbarSize: 0,
            url: "kcmxsq_bindtj",
            columns: [col],
            pageSize: 10,
            pageList: [10, 20, 30, 50],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            selectOnCheck: false,
            checkOnSelect: false,
            onLoadSuccess: function (data) {
                $(".datagrid-header-check").find('input').hide();
            },
            onClickRow: function (index, rowData, e) {
                var tt = $(e.target);
                var tr = tt.closest("tr.datagrid-row");
                var td = tt.closest("td[field]", tr);
                if (tr.hasClass("datagrid-row-selected")) {
                    $(this).datagrid("unselectRow", index);
                }
                if (tr.hasClass("datagrid-row-checked")) {
                    $(this).datagrid("checkRow", index);
                }
               
            }
        });
    }

    function Getlist() {
        $.ajax({
            url: "kcmxsq_list",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                if (data.wsq.length == 0 && data.ysq.length == 0) {
                    document.location = "../default/err?msg=尚未分配可免修申请课程";
                }
                var html = "";
                $.each(data.wsq, function (i, o) {
                    html += '<li>'
                           + '     <div class="kcinfo-group">'
                           + '          <div class="kcinfo-title">' + o.kcmc + '<span class="red">开放时间: ' + o.ksrq + '至' + o.jzrq + '</span></div>'
                           + '          <div class="kcinfo-content">'
                           + '              <span class="marginright20"><span class="gray">编号:</span> ' + o.kcbh + '</span>'
                           + '              <span class="marginright20"><span class="gray">开课院系:</span> ' + o.xsmc + '</span>'
                           + '              <span class="marginright20"><span class="gray">学分:</span> ' + o.kcxf + '</span>'
                           + '              <p id="sqsj' + i + '" style="display:none;"><span class="marginright20"><span class="gray">申请时间:</span> ' + data.sqsj + '</span>'
                           + '              <span class="marginright20"><span class="gray">学期:</span> ' + data.dqxq + '</span></p>'
                           + '              <p id="bz' + i + '" style="display:none;"><span class="marginright20"><span class="gray">说明:</span> ' + o.bz + '</span></p>'
                           + '          </div>'
                           + '      </div>'
                           + '      <div class="kcinfo-right">'
                           + '          <div id="kcinfo-note' + i + '" class="kcinfo-note">'
                           + '              <p><span class="gray">说明:</span> ' + o.bz + '</p>'
                           + '          </div>'
                           + '          <div id="kcinfo-form' + i + '" class="kcinfo-form" style="display:none;">'
                           + '              <p><span class="gray">申请说明</span></p>'
                           + '              <textarea id="sqly' + i + '" class="textarea"></textarea>'
                           + '              <p><span class="gray">证明材料</span></p>'
                           + '              <div id="file-upload' + i + '" class="file-upload">'
                           + '                  <div class="file-item">'
                           + '                      <a id="btn_add' + i + '" href="javascript:void(0)" class="file-btn" onclick=addimg("' + o.kcbh + '","' + i + '","")></a>'
                           + '                  </div>'
                           + '                  <div class="clear"></div>'
                           + '              </div>'
                           + '              <div class="btn_area">'
                           + '                   <input id="hfkcmc' + i + '" type="hidden" value="' + o.kcmc + '" />'
                           + '                  <button type="button" class="btn-primary floatright" onclick=kcmxsq_add("' + i + '","' + o.kcbh + '")>提交申请</button>'
                           + '                  <button type="button" class="btn-default floatright marginright20" onclick=kcmxsq_cancel("' + i + '","' + o.kcbh + '")>取消</button>'
                           + '              </div>'
                           + '          </div>'
                           + '      </div>'
                           + '      <button id="btn-sqmx' + i + '" type="button" class="btn-primary kcinfo-btn" ' + (o.sfyx == '1' ? '' : 'disabled') + ' onclick=kcmxsq_addshow("' + i + '")>申请免修</button>'
                           + '</li>';
                });
                $.each(data.ysq, function (i, o) {
                    var i = i + data.wsq.length;
                    var img = "";
                    var dropdisplay = "";
                    if (o.checknum == "-1")
                        img = "img_wtg.png";
                    else if (o.checknum == "1") {
                        img = "img_ysh.png";
                        dropdisplay = 'style="display:none;"';
                    }
                    else
                        img = "img_wsh.png";
                    html += '<li>'
                           + '    <div class="kcinfo-group">'
                           + '     <div class="kcinfo-title">' + o.kcmc + '<span>开放时间：' + o.ksrq + '至' + o.jzrq + '</span></div>'
                           + '     <div class="kcinfo-content">'
                           + '         <span class="marginright20"><span class="gray">编号:</span> ' + o.kcbh + '</span>'
                           + '         <span class="marginright20"><span class="gray">开课院系:</span> ' + o.xsmc + '</span>'
                           + '         <span class="marginright20"><span class="gray">学分:</span> ' + o.kcxf + '</span>'
                           + '         <p><span class="marginright20"><span class="gray">申请时间:</span> ' + o.sqrq + '</span>'
                           + '         <span class="marginright20"><span class="gray">学期:</span> ' + o.termname + '</span></p>'
                           + '         <p><span class="marginright20"><span class="gray">说明:</span> ' + o.bz + '</span></p>'
                           + '     </div>'
                           + ' </div>'
                           + ' <div class="kcinfo-right">'
                           + '    <div class="kcinfo-form">'
                           + '         <div class="kcinfo-form-more">'
                           + '             <a href="jsvascript:void(0)" class="form-more-link" onclick="kcmxsq_dropshow(this)" ' + dropdisplay + '></a>'
                           + '             <div id="tab-popover' + i + '" class="tab-popover" style="display:none;">'
                           + '                 <a href="javascript:void(0)" class="current" onclick=kcmxsq_editshow("' + i + '","'+o.bh+'")>编辑</a>'
                           + '                 <a href="javascript:void(0)" onclick=kcmxsq_qxsq("' + o.id + '")>取消申请</a>'
                           + '             </div>'
                           + '         </div>'
                           + '         <p><span class="gray">申请说明</span><span id="sqlyspan' + i + '">' + o.sqly + '</span></p>'
                           + '         <textarea id="sqly' + i + '" class="textarea" style="display:none;">' + o.sqly + '</textarea>'
                           + '         <p><span class="gray">证明材料</span><span class="red"></span></p>'
                           + '         <div id="file-upload' + i + '" class="file-upload">';
                    $.each(o.filenames, function (i1, o1) {
                        var src = '/' + data.wjlj.replace('~/', '') + o1;
                        var htmlimg = '   <div class="file-item">'
                               + '                 <div class="file-img">'
                               + ' <div id="preview" class="spec-preview"> '
                               + ' <span class="jqzoom" > '
                               + '                     <img src="' + src + '" jqimg="' + src + '" width="60" height="60"/>'
                               + ' </span>'
                               + '    </div>'
                               + '                 </div>'
                               + '                 <a href="javascript:void(0)" class="file-close" onclick=delimg(this,"' + o1 + '") style="display:none;"></a>'
                               + '             </div>';
                        html += htmlimg;
                    });
                    html += '                   <div id="file_add' + i + '" class="file-item" style="display:none;">'
                           + '                      <a id="btn_add' + i + '" href="javascript:void(0)" class="file-btn" onclick=addimg("' + o.kcbh + '","' + i + '","' + o.id + '")></a>'
                           + '                  </div>'
                           + '                  <div class="clear"></div>'
                           + '              </div>'
                           + '         <p style="white-space: normal;"><span class="gray">选择英语水平</span><span id="sqlyspan' + i + '">' + o.sqcj + '</span></p>'
                           + '              <div id="btn_area' + i + '" class="btn_area" style="display:none;">'
                           + '                  <input id="hidid' + i + '" type="hidden" value="' + o.id + '" /><input id="hfkcmc' + i + '" type="hidden" value="' + o.kcmc + '" />'
                           + '                  <button type="button" class="btn-primary floatright" onclick=kcmxsq_editsave("' + i + '","' + o.id + '")>提交申请</button>'
                           + '                  <button type="button" class="btn-default floatright marginright20" onclick=kcmxsq_editcancel("' + i + '")>取消</button>'
                           + '              </div>'
                           + '    </div>'
                           + ' </div>'
                           + '<div class="kcinfo-fettle"><img src="../../images/' + img + '" /></div>'
                        + '</li>';
                });
                //$("#list").append(html);
                $("#list").html(html);
                $(document).bind('click', function (e) {
                    var e = e || window.event;
                    var elem = e.target || e.srcElement;
                    while (elem) {
                        if (elem.className && elem.className.indexOf('kcinfo-form-more') > -1) {
                            return;
                        }
                        elem = elem.parentNode;
                    }
                    $('.tab-popover').css('display', 'none');
                });
                $(".jqzoom").jqueryzoom({ xzoom: 380, yzoom: 410 });

            }
        })
    }

    //显示新增状态
    function kcmxsq_addshow(index) {

        $("#kcinfo-form" + index).show();
        $("#kcinfo-note" + index).hide();
        $("#sqsj" + index).show();
        $("#bz" + index).show();
        $("#btn-sqmx" + index).hide();
    }

    //显示编辑下拉框
    function kcmxsq_dropshow(target) {
        $(target).next().slideToggle();
    }

    //显示编辑状态
    function kcmxsq_editshow(index,bh) {
        $("#sqly" + index).show();
        $("#sqlyspan" + index).hide();
        $("#btn_area" + index).show();
        $("#file_add" + index).show();
        $("#tab-popover" + index).slideToggle();
        $("#file-upload" + index).find("a").show();
        var rows = $("#dg").datagrid('getRows');
        $.each(rows, function (index, row) {
            $("#dg").datagrid("uncheckRow", index);
            if (row.bh == bh) {
                $("#dg").datagrid("checkRow", index);
            }
        })
    }

    function addimg(kcbh, index, id) {
        $("#hfid").val(id);
        $("#hfkcbh").val(kcbh);
        $("#hfindex").val(index);
        $("#File1").click();
    }

    function delimg(target, filename) {
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "kcmxsq_delimg",
            data: { 'filename': filename },
            cache: false,
            success: function (data) {
                if (data.zt == "1") {
                    $(target).parent().remove();
                }
                else {
                    $.messager.alert('提示', data.msg);
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function btnupload_click() {
        var btnupload = document.getElementById("btnupload");
        btnupload.click();
    }

    function file_upload() {
        var index = $("#hfindex").val();
        $("#fileform").ajaxSubmit({
            url: "kcmxsq_addimg",
            type: "post",
            success: function (data) {
                if (data.zt == "1") {
                    var src = '/' + data.wjlj.replace('~/', '') + data.filename
                    var html = '<div class="file-item">'
                     + '    <div class="file-img">'
                     + '        <img src="' + src + '" width="60"  height="60"/>'
                     + '    </div>'
                     + '    <a href="javascript:void(0)" class="file-close" onclick=delimg(this,"' + data.filename + '")></a>'
                     + '</div>';
                    $("#btn_add" + index).parent().before(html);
                }
                else {
                    $.messager.alert('提示', data.msg);
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function kcmxsq_cancel(index, kcbh) {
        $("#kcinfo-form" + index).hide();
        $("#kcinfo-note" + index).show();
        $("#sqsj" + index).hide();
        $("#bz" + index).hide();
        $("#btn-sqmx" + index).show();
        var html = '<div class="file-item">'
        + '                      <a id="btn_add' + index + '" href="javascript:void(0)" class="file-btn" onclick=addimg("' + kcbh + '","' + index + '")></a>'
        + '                  </div>'
        + '                  <div class="clear"></div>';
        $("#file-upload" + index).html(html);
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "kcmxsq_cancel",
            data: { 'kcbh': kcbh },
            cache: false,
            success: function (data) {

            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                $.messager.alert("提示", msg, "error");
            }
        });
    }

    function kcmxsq_add(index, kcbh) {
        var sqly = $("#sqly" + index).val();
        var kcmc = $("#hfkcmc" + index).val();
        var rows = $("#dg").datagrid('getChecked');
        if (kcmc.indexOf("英语") > -1) {
            if (rows.length == 0) {
                $.messager.alert("提示", "英语课程免修申请，请选择你的英语水平！", "error");
                return;
            }
            if (rows.length >1) {
                $.messager.alert("提示", "英语课程免修申请，有且只能选中一项英语水平！", "error");
                return;
            }
        }
        var row = rows[0];
        var pycc = row.pycc;
        var bh = row.bh;
        var mxcj = row.cj;
        var yycj = "";
        var yycjobj = $("#sqcj" + row.bh);
        if (yycjobj.length > 0) {
            yycj = yycjobj.val();
        }
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "kcmxsq_add",
            data: { 'kcbh': kcbh, 'sqly': sqly, 'pycc': pycc, 'bh': bh, "mxcj": mxcj, "yycj": yycj },
            cache: false,
            success: function (data) {
                if (data.zt == "1") {
                    $.messager.alert("提示", "提交成功");
                    Getlist();
                }
                else
                    $.messager.alert("提示", data.msg);
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function kcmxsq_editcancel(index) {
        $("#sqly" + index).hide();
        $("#sqlyspan" + index).show();
        $("#btn_area" + index).hide();
        $("#file_add" + index).hide();
        $("#file-upload" + index).find("a").hide();
    }

    function kcmxsq_editsave(index, id) {
        var sqly = $("#sqly" + index).val();
        var kcmc = $("#hfkcmc" + index).val();
        var rows = $("#dg").datagrid('getChecked');
        if (kcmc.indexOf("英语") > -1) {
            if (rows.length == 0) {
                $.messager.alert("提示", "英语课程免修申请，请选择你的英语水平！", "error");
                return;
            }
            if (rows.length > 1) {
                $.messager.alert("提示", "英语课程免修申请，有且只能选中一项英语水平！", "error");
                return;
            }
        }
        var row = rows[0];
        var pycc = row.pycc;
        var bh = row.bh;
        var mxcj = row.cj;
        var yycj = "";
        var yycjobj = $("#sqcj" + row.bh);
        if (yycjobj.length > 0) {
            yycj = yycjobj.val();
        }
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "kcmxsq_edit",
            data: { 'id': id, 'sqly': sqly, 'pycc': pycc, 'bh': bh, "mxcj": mxcj, "yycj": yycj },
            cache: false,
            success: function (data) {
                if (data.zt == "1") {
                    $.messager.alert("提示", "提交成功");
                    $("#sqlyspan" + index).html(sqly);
                    kcmxsq_editcancel(index);
                }
                else
                    $.messager.alert("提示", data.msg);
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function kcmxsq_qxsq(id) {
        $.messager.confirm("提示", "你确定要取消申请吗?", function (r) {
            if (r) {
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    url: "kcmxsq_qxsq",
                    data: { 'id': id },
                    cache: false,
                    success: function (data) {
                        if (data.zt == "1") {
                            $.messager.alert("提示", "取消成功");
                            Getlist();
                        }
                        else
                            $.messager.alert("提示", data.msg);
                    },
                    error: function (e) {
                        var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
                    }
                });
            }
        });
    }
