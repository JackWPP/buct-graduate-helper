<body>
    <div>
      
<script type="text/javascript">
    var editIndex = undefined;
    var isadd = false;
    var pxsdata;
    $(function () {
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: 'bindpyfacx',
            cache: false,
            success: function (json) {
                $('#searchxslb').combobox({
                    data: json.xslbs,
                    editable: false,
                    valueField: 'xslbm',
                    textField: 'xslb',
                    required: true,
                    onSelect: function (rec) {
                        GetList();
                    }
                });
                $('#searchyxsh').combobox({
                    data: json.yxlist,
                    editable: false,
                    valueField: 'xsbh',
                    textField: 'xsmc',
                    required: true,
                    onSelect: function (rec) {
                        GetList();
                    }
                });
                $('#searchzydm').combobox({
                    data: json.zylist,
                    editable: false,
                    valueField: 'zydm',
                    textField: 'zymc',
                    required: true,
                    onSelect: function (rec) {
                        GetList();
                    }
                });
                //默认勾选学生本人的学生类别、院系、专业
                $('#searchxslb').combobox('setValue', json.xslbm);
                $('#searchyxsh').combobox('setValue', json.yxsh);
                $('#searchzydm').combobox('setValue', json.zydm);
                GetList();
            }
        });
    })

    function GetList() {
        var xslbm = $('#searchxslb').combobox('getValue');
        var yxsh = $('#searchyxsh').combobox('getValue');
        var zydm = $('#searchzydm').combobox('getValue');
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: 'pyfacxlist',
            queryParams: { 'xslbm': xslbm, 'yxsh': yxsh, 'zydm': zydm },
            loadMsg: '正在加载....',
            columns: [[
                { field: 'xsmc', title: '院系', width: 100, sortable: false },
                { field: 'zydm', title: '专业（领域）代码', width: 100, sortable: true },
                { field: 'zymc', title: '专业（领域）名称', width: 200, sortable: false },
                { field: 'yjfxm', title: '研究方向', width: 100, sortable: true,
                    formatter: function (value, row) {
                        return row.yjfxmc;
                    }
                },
                { field: 'jwzydm', title: '教委专业代码', width: 100, sortable: false },
                { field: 'lylb', title: '领域类别', width: 100, sortable: false },
                { field: 'ck', title: '查看', width: 60, align: 'center', sortable: true,
                    formatter: function (value, row) {
                        var e = '<a class="l-btn l-btn-small l-btn-plain" href="pyfady_show?id=' + row.id + '" target="_blank"><span class="l-btn-left l-btn-icon-left"><span class="l-btn-text">查看</span><span class="l-btn-icon icon-search">&nbsp;</span></span></a> ';
                        return e;
                    }
                }
            ]],
            fitColumns: true,
            striped: true,
            rownumbers: true, //行号
            singleSelect: false, //是否单选 
            toolbar: '#searchdiv',
            pageSize: 10,
            pageList: [10, 20, 30, 50],
            pagination: true
        });

    }

    function getRowIndex(target) {
        var tr = $(target).closest('tr.datagrid-row');
        return parseInt(tr.attr('datagrid-row-index'));
    }
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            
            <div class="Operating_area">
                学生类别：<input id="searchxslb" class="easyui-combobox" data-options="height:10" style="height:36px;" />
                <span style="display: none;">
                    院系：<input id="searchyxsh" class="easyui-combobox" data-options="height:10" style="height:36px;" />
                </span>
                专业（领域）：<input id="searchzydm" class="easyui-combobox" data-options="height:10" style="height:36px;" />
                    <a href="pyfacx_zip" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:false">下载2026级研究生培养方案</a>
            </div>
            <table id="dg">
            </table>
        </div>
    </div>
</div>
