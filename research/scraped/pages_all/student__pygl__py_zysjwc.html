<script type="text/javascript">
    $(function () {
        //GetList();
        pageload();
        
        // 监听文件选择事件，更新隐藏字段
        $('#yqh').filebox({
            onChange: function (newValue, oldValue) {
                if (newValue) {
                    $('input[name="yqh"]').val(newValue);
                }
            }
        });
        
        $('#bxd').filebox({
            onChange: function (newValue, oldValue) {
                if (newValue) {
                    $('input[name="bxd"]').val(newValue);
                }
            }
        });
        
        $('#cns').filebox({
            onChange: function (newValue, oldValue) {
                if (newValue) {
                    $('input[name="cns"]').val(newValue);
                }
            }
        });
        
        $('#aqya').filebox({
            onChange: function (newValue, oldValue) {
                if (newValue) {
                    $('input[name="aqya"]').val(newValue);
                }
            }
        });
    });

    function pageload() {
        var id = $("#hfid").val();
        var xh = $("#hfxh").val();
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: "zysjwc_load" + "?id=" + id+"&xh=" + xh,
            cache: true,
            success: function (data) {
                if (data.zt == "0") {
                    $("#btnsubmit").hide();
                    $("#btnsave").hide();

                    $.messager.alert("提示", data.msg1, "error");
                    return;
                }
                //显示学生信息
                var xsxx = data.xsxx[0];
                $("#xh").html(xsxx.xh);
                $("#xsxm").html(xsxx.xm);
                $("#xymc").html(xsxx.xsmc);
                $("#dsxm").html(xsxx.dsxm);
                if (data.shjl) {
                    shlxx(data.shjl);
                }

                if (data.sqbxx && data.sqbxx.length > 0) {
                    var sqbxx = data.sqbxx[0];
                    $("#sfbx").combobox("setValue", sqbxx.sfbx);
                    $("#kssj").datebox("setValue", sqbxx.kssj);
                    $("#jssj").datebox("setValue", sqbxx.jssj);
                    $("#wcdd").textbox("setValue", sqbxx.wcdd);
                    if (sqbxx.yqh != "") {
                        $("input[name='yqh']").val(sqbxx.yqh);
                    }
                    if (sqbxx.bxd != "") {
                        $("input[name='bxd']").val(sqbxx.bxd);
                    }
                    if (sqbxx.cns != "") {
                        $("input[name='cns']").val(sqbxx.cns);
                    }
                    if (sqbxx.aqya != "") {
                        $("input[name='aqya']").val(sqbxx.aqya);
                    }
                    if (sqbxx.gzdd != "") {
                        $("#gzdd").textbox("setValue", sqbxx.gzdd);
                    }
                    if (sqbxx.gznr != "") {
                        $("#gznr").textbox("setValue", sqbxx.gznr);
                    }
                    if (sqbxx.txry != "") {
                        $("#txry").textbox("setValue", sqbxx.txry);
                    }
                    if (sqbxx.hdlx != "") {
                        $("#hdlx").textbox("setValue", sqbxx.hdlx);
                    }
                    if (sqbxx.jtgj != "") {
                        $("#jtgj").textbox("setValue", sqbxx.jtgj);
                    }
                }
                controlbtn();
            }
        });
    }

    function shlxx(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    shz = false;
                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    if (shz) {
                        html += '<div class="step_sm_item step_sm_processing"><span class="name">' + o.shlmc + '</span> <span class="time">审核中…</span>';
                        shz = false;
                    } else {
                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                '  </li>';
        })
        $("#step_sm").html(html);
    }


    //下载
    function controlbtn() {
        var id = $("#hfid").val();
        if (id != "0") {
            $.post("getpy_zysjwcinfo", { id: id }, function (data) {
                if (data.yqh != "") {
                    $("#Downyqh").text("点击下载").attr("href", "zysjwc_down?id=" + id + "&type=yqh&date=" + new Date().getMilliseconds());
                }
                if (data.bxd != "") {
                    $("#Downbxd").text("点击下载").attr("href", "zysjwc_down?id=" + id + "&type=bxd&date=" + new Date().getMilliseconds());
                }
                if (data.cns != "") {
                    $("#Downcns").text("点击下载").attr("href", "zysjwc_down?id=" + id + "&type=cns&date=" + new Date().getMilliseconds());
                }
                if (data.aqya != "") {
                    $("#Downaqya").text("点击下载").attr("href", "zysjwc_down?id=" + id + "&type=aqya&date=" + new Date().getMilliseconds());
                }
            }, 'json');
        }
    }

    //保存和提交
    function btn_save(zt) {
        var info = $('#ff').serializeObject();

        // 提交时验证所有字段
        if (zt == "0") {
            if (info.sfbx == "") {
                $.messager.alert("提示", "请选择是否已购买保险！", "error");
                return;
            }
            if (info.wcdd == "") {
                $.messager.alert("提示", "请填写外出地点！", "error");
                return;
            }
            if (info.kssj == "") {
                $.messager.alert("提示", "请选择开始时间！", "error");
                return;
            }
            if (info.jssj == "") {
                $.messager.alert("提示", "请选择结束时间！", "error");
                return;
            }
            if (info.yqh == "") {
                $.messager.alert("提示", "请上传邀请函附件！", "error");
                return;
            }
            if (info.bxd == "") {
                $.messager.alert("提示", "请上传保险单附件！", "error");
                return;
            }
            if (info.cns == "") {
                $.messager.alert("提示", "请上传承诺书附件！", "error");
                return;
            }
            if (info.aqya == "") {
                $.messager.alert("提示", "请上传安全预案附件！", "error");
                return;
            }
            if (info.gzdd == "") {
                $.messager.alert("提示", "请填写工作地点！", "error");
                return;
            }
            if (info.gznr == "") {
                $.messager.alert("提示", "请填写工作内容！", "error");
                return;
            }
            if (info.txry == "") {
                $.messager.alert("提示", "请填写同行人员！", "error");
                return;
            }
            if (info.hdlx == "") {
                $.messager.alert("提示", "请填写活动路线！", "error");
                return;
            }
            if (info.jtgj == "") {
                $.messager.alert("提示", "请填写交通工具！", "error");
                return;
            }
        }

        if (info.id == "") {
            info.id = "0";
        }
        var tsxx = "保存";
        if (zt == "0")
            tsxx = "提交";
        var jsonObject = JSON.stringify(info);
        pageloadms("请稍候。。。");
        $('#ff').ajaxSubmit({
            type: 'post',
            url: "zysjwc_save",
            dataType: "json",
            data: { 'json': jsonObject, 'zt': zt },
            cache: false,
            success: function (json) {
                if (json.zt == "0") {
                    $.messager.alert("提示", json.msg, "error");
                }
                else if (json.zt == "1") {
                    $("#hfid").val(json.id);
                    $.messager.alert("提示", tsxx + "成功");
                    pageload();
                }
                dispageload();
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

</script>
