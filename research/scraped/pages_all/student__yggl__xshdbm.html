<script type="text/javascript">

    

    $(function () {
        GetList();
        GetList_sq();
    });
    function GetList() {
        var head = '<tr class="head">' +
				   '	<td width="40px">类别</td>' +
				   '	<td width="150px">报名(活动)名称</td>' +
					'	<td width="70px">发布单位</td>' +
                    '   <td width="110px">报告（活动）开始时间</td>' +
                    '   <td width="110px">报告（活动）截止时间</td>' +
                    '   <td width="150px">报告（活动）地点</td>' +
                    '   <td width="50px">可报名人数</td>' +
                    '   <td width="70px">主办单位</td>' +
                    '   <td width="70px">报名方式</td>' +
                    '   <td width="100px">报名开始时间</td>' +
                    '   <td width="100px">报名截止时间</td>' +
                    '   <td width="50px">项目化加分</td>' +
                    '   <td width="50px">报告时长</td>' +
                    '   <td width="45px">审核状态</td>' +
                    '	<td width="45px" class="operate">提交心得</td>' +
					'	<td width="45px" class="operate">取消报名</td>' +
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_gw tbody').empty();
        $('#td_gw tbody').append(head);
        $.ajax({
            url: "xshdbm_cklist",
            type: "post",
            dataType: "json",
            data: {},
            success: function (data) {
                if (data.rows.length == 0) {
                    var tr = "<tr class='odd'><td colspan='16'>未报名活动</td></tr>";
                    $('#td_gw tbody').append(tr);
                    return;
                }
                //$('#imgVerifi').attr('src', '/Home/VerificationCode' + '?t=' + new Date().getSeconds());
                $.each(data.rows, function (i, o) {
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';

                    tr += '      <td>' + o.fl + '</td>' +
                       '         <td>' + o.mc + '</td>' +
                       '         <td>' + o.fbdw + '</td>' +
                       '         <td>' + o.kssj + '</td>' +
                       '         <td>' + o.jzsj + '</td>' +
                       '         <td>' + o.dd + '</td>' +
                       '         <td>' + o.rs + '</td>' +
                       '         <td>' + o.zbdw + '</td>' +
                       '         <td>' + o.bmfs + '</td>' +
                       '         <td>' + o.bmkssj + '</td>' +
                       '         <td>' + o.bmjzsj + '</td>' +
                       '         <td>' + o.fs + '</td>' +
                       '         <td>' + o.hdsc + '</td>' +
                        '         <td>' + o.shbj + '</td>' +
                        '         <td><a href="xshdxdtj?id=' + o.hdid + '" class="btn-link">提交</a></td>' +
                       '         <td><a href="javascript:void(0)" class="btn-link" onclick=show_del("' + o.hdid + '")>取消</a></td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_gw tbody').append(tr);

                })
            }
        });
    }

    function GetList_sq() {
        var head = '<tr class="head">' +
				   '	<td width="40px">类别</td>' +
				   '	<td width="150px">报名(活动)名称</td>' +
					'	<td width="70px">发布单位</td>' +
                    '   <td width="100px">报告（活动）开始时间</td>' +
                    '   <td width="100px">报告（活动）截止时间</td>' +
                    '   <td width="150px">报告（活动）地点</td>' +
                    '   <td width="50px">可报名人数</td>' +
                    '   <td width="50px">已报名人数</td>' +
                    '   <td width="60px">主办单位</td>' +
                    '   <td width="50px">报名方式</td>' +
                    '   <td width="100px">报名开始时间</td>' +
                    '   <td width="100px">报名截止时间</td>' +
                    '   <td width="50px">项目化加分</td>' +
                    '	<td width="50px" class="operate">查看详情</td>' +
					'	<td width="50px" class="operate">我要报名</td>' +
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_sqjl tbody').empty();
        $('#td_sqjl tbody').append(head);
        $.ajax({
            url: "xshdbm_sqlist",
            type: "post",
            dataType: "json",
            data: {},
            success: function (data) {
                if (data.rows.length == 0) {
                    var tr = "<tr class='odd'><td colspan='16'>暂未发布活动</td></tr>";
                    $('#td_sqjl tbody').append(tr);
                    return;
                }
                $.each(data.rows, function (i, o) {
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                    tr = '<tr class="even">';

                    tr += '      <td>' + o.fl + '</td>' +
                       '         <td>' + o.mc + '</td>' +
                       '         <td>' + o.fbdw + '</td>' +
                       '         <td>' + o.kssj + '</td>' +
                       '         <td>' + o.jzsj + '</td>' +
                       '         <td>' + o.dd + '</td>' +
                       '         <td>' + o.rs + '</td>' +
                       '         <td>' + o.bmrs + '</td>' +
                       '         <td>' + o.zbdw + '</td>' +
                       '         <td>' + o.bmfs + '</td>' +
                       '         <td>' + o.bmkssj + '</td>' +
                       '         <td>' + o.bmjzsj + '</td>' +
                       '         <td>' + o.fs + '</td>' +
                        '         <td><a href="xshdbmck?id=' + o.id +'" class="btn-link" >查看</a></td>' +
                       '         <td><a href="javascript:void(0)" class="btn-link" onclick=sfkysq("' + o.id + '")>报名</a></td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_sqjl tbody').append(tr);
                })
            }
        });
    }




    //是否可以申请
    function sfkysq(id) {
        $.ajax({
            type: 'get',
            dataType: "json", //返回json格式的数据
            url: "xshdbm_sfkysq",
            data: { 'id': id },
            cache: false,
            success: function (data) {
                if (data.sign == "0") {
                    $.messager.alert("提示", "不在报名时间内！", "error");
                    return;
                } else {
                    show_add(id);
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }


    function show_add(id) {
        $.messager.confirm("提示",
            "请同学们诚信报名并听取学术报告。对于每学年学术报告缺勤达两次及以上者，将记入诚信档案，影响当年评奖评优!<br/>" +
            " <form align=\"middle\">" +
            " <input type =\"text\" class=\"inputtext width60\" style=\"height: 25px; vertical-align: middle;\" id=\"VeriCode\" name=\"VeriCode\"/>" +
            " <img id=\"imgVerifi\" title=\"单击获取验证码\" style=\"height: 33px;vertical-align: middle;\" src=\"VerificationCode\"  class=\"inputimage\" onclick=\"changecode()\" /><from/>", 
            function (r) {
                var VeriCode = $("#VeriCode").val();
                if (r) {
                    $.ajax({
                        type: 'post',
                        dataType: 'json',
                        url: "xshdbm_bm",
                        data: { 'id': id, 'VeriCode': VeriCode },
                        cache: false,
                        success: function (data) {
                            if (data.sign == "-1") {
                                $.messager.alert("提示", "不在报名时间内！", "error");
                                return;
                            }

                            if (data.msg) {
                                $.messager.alert("提示", data.msg, "error");
                                setTimeout("window.location.reload()", 1000);
                            }
                            else {
                                if (data.zt = "1") {
                                    $.messager.alert("提示", "报名成功");
                                    setTimeout("window.location.reload()", 1000);
                                }
                                else {
                                    $.messager.alert("提示", "报名失败", "error");
                                    setTimeout("window.location.reload()", 1000);
                                }
                            }
                        },
                        error: function (e) {
                            var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
                            setTimeout("window.location.reload()", 1000);
                        }
                  
                    });
                }
                else {
                    setTimeout("window.location.reload()", 500);
                }
                
            });
        $(".panel-tool-close").css("display", "none");
    }

    function show_del(hdid) {
        $.messager.confirm("提示", "你确定要取消报名吗?", function (r) {
            if (r) {
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    url: "xshdbm_del",
                    data: { 'hdid': hdid },
                    cache: false,
                    success: function (data) {
                        if (data.msg) {
                            $.messager.alert("提示", data.msg, "error");
                        }
                        else {
                            if (data.zt = "1") {
                                $.messager.alert("提示", "取消报名成功");
                                GetList();
                                GetList_sq();
                            }
                            else {
                                $.messager.alert("提示", "取消报名失败", "error");
                            }
                        }
                    },
                    error: function (e) {
                        var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
                    }
                });
            }
        });
    }

    function changecode() {
        $('#imgVerifi').attr('src', '/Home/VerificationCode' + '?t=' + new Date().getTime());
    }

    function printword() {

        var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
        $("body").append(form); //将表单放置在web中
        form.attr("action", "printword");
        form.submit();
    }
</script>
