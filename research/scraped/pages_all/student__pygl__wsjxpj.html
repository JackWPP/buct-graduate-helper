<body>
    <div>
      
<script type="text/javascript">
    $(function () {
        GetList();
    });

    function GetList() {
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: 'wsjxpjlist',
            queryParams: {},
            loadMsg: '正在加载....',
            columns: [[
                { field: 'bjid', hidden: true },
                { field: 'termname', title: '学期', width: 80 },
                { field: 'kcbh', title: '课程编号', width: 80 },
                { field: 'kcmc', title: '课程名称', width: 100 },
                { field: 'bjmc', title: '班级名称', width: 110 },
                { field: 'jsxm', title: '任课教师', width: 80 },
                { field: 'kssj', title: '开始日期', width: 70, align: 'center' },
                { field: 'jssj', title: '截止日期', width: 70, align: 'center' },
                { field: 'pjckcj', title: '评价后查看成绩', width: 70, align: 'center',
                    formatter: function (value, row, index) {
                        if (value == '1')
                            return '是';
                        else if (value == '0')
                            return '否';
                        else
                            return '';
                    }
                },
                { field: 'action', title: '评价', width: 70, align: 'center',
                    formatter: function (value, row, index) {
                        if (row.yxpj == "1") {
                            if (row.sfpj == '1') {
                                var e = '<a class="but-link" href="wsjxpj_pj?bjid=' + row.bjid + '&jsbh=' + row.jsbh + '"><span class="icon icon-finish"></span>评价</a> ';
                                return e;
                            }
                            else {
                                var e = '<a class="but-link" href="wsjxpj_pj?bjid=' + row.bjid + '&jsbh=' + row.jsbh + '"><span class="icon icon-edit"></span>评价</a> ';
                                return e;
                            }
                        }
                    }
                }
            ]],
            pagination: false, //分页控件 
            fitColumns: true,
            striped: true,
            rownumbers: true, //行号
            singleSelect: true, //是否单选 
            toolbar: '#searchdiv',
            onLoadSuccess: function (data) {
                var s = $("#dg").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row td[field!=action]');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            },
            onLoadError: function () {
                $.messager.alert("提示", "加载失败", "error");
            }
        });
    }


    function getRowIndex(target) {
        var tr = $(target).closest('tr.datagrid-row');
        return parseInt(tr.attr('datagrid-row-index'));
    }

    
</script>
<div class="Slayout">
    <div class="container">
        <div class="layout_box">
            <div class="Operating_area">
            </div>
            <table id="dg">
            </table>
        </div>
    </div>
</div>

    </div>
