    function GetList() {

                    showidarr.push("#hksj");
                }
                else {
                    hideidarr.push("#phksm");
                    hideidarr.push("#hksj");
                }

                var hideidstr = hideidarr.join(",");
                $(hideidstr).css("display", "none");
                $(showidarr).css("display", "");
                var html = "";
                if (data.cj) {
                    $.each(data.cj, function (i, o) {
                        var cxdis = "";
                        var bkdis = "";
                        if (data.kycx && data.kycx == "0") {
                            cxdis = "disabled";
                        }
                        if (data.kybk && data.kybk == "0") {

							'		<div class="XiuKao-info">' +
							'			<dl>' +
							'				<dt>授课学期</dt><dd>第' + o.xxxq + '学期</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>课程名称</dt><dd style="height:50px;line-height:25px;">' + o.kcmc + '</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>任课教师</dt><dd>' + o.rkjs + '</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-info">' +
							'			<dl class="info-number">' +
							'				<dt>成绩</dt><dd>' + o.cj + '</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-link">';
                        if (data.cxshow == "1") {
                            html += '			<div class="btn-left">' +
							'				<button type="button" class="btn-primary btn-small" ' + cxdis + ' onclick=show_add("' + o.kcbh + '","' + o.kcmc + '","1")>重修</button>' +
							'			</div>';

                        //                            html += '			<div class="btn-right">' +

                        //                        }
                        html += '		</div>' +
							'	</div>' +
							'</li>';
                    });
                }
                //缓考申请
                $.each(data.hk, function (i, o) {
                    var hkdis = "";
                    if (data.kyhk && data.kyhk == "0") {
                        hkdis = "disabled";
                    }
                    if (o.sfkyhk != "0") {

                    }
                    html += '<li>' +
							'	<div class="XiuKao-group">' +
							'		<img src="../../images/column-bg05.png" alt="" class="book_corner">' +
							'		<div class="XiuKao-info">' +
							'			<dl>' +
							'				<dt>授课学期</dt><dd>第' + o.xxxq + '学期</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>课程名称</dt><dd style="height:50px;line-height:25px;">' + o.kcmc + '</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>任课教师</dt><dd>' + o.rkjs + '</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-info">' +
							'			<dl class="info-number">' +
							'				<dt>成绩</dt><dd>无成绩</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-link">';
                    //                    if (data.cxshow == "1") {
                    //                        html += '			<div class="btn-left" style="width:25%">' +
                    //							'				<button type="button" class="btn-primary btn-small" ' + cxdis + ' onclick=show_add("' + o.kcbh + '","' + o.kcmc + '","1")>重修</button>' +
                    //							'			</div>';
                    //                    }
                    //                    if (data.bkshow == "1") {
                    //                        html += '			<div class="btn-right" style="width:25%">' +
                    //							'				<button type="button" class="btn-primary btn-small" ' + bkdis + ' onclick=show_add("' + o.kcbh + '","' + o.kcmc + '","3")>补考</button>' +
                    //							'			</div>';
                    //                    }
                    if (data.hkshow == "1") {
                        html += '			<div class="btn-right">' +
							'				<button type="button" class="btn-primary btn-small" ' + hkdis + ' onclick=show_add("' + o.kcbh + '","' + o.kcmc + '","2","' + o.bjid + '")>缓考</button>' +

                    }
                    html += '		</div>' +
							'	</div>' +
							'</li>';

                });
                //补考申请
                $.each(data.bk, function (i, o) {
                    var bkdis = "";
                    if (data.kybk && data.kybk == "0") {
                        bkdis = "disabled";
                    }
                    if (o.sfkybk != "0") {
                        bkdis = "disabled";
                    }
                    if (o.bkwcbj == "1") {
                        bkdis = "disabled";
                    }
                    html += '<li>' +
							'	<div class="XiuKao-group">' +
							'		<img src="../../images/column-bg05.png" alt="" class="book_corner">' +
							'		<div class="XiuKao-info">' +
							'			<dl>' +
							'				<dt>授课学期</dt><dd>第' + o.xxxq + '学期</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>课程名称</dt><dd style="height:50px;line-height:25px;">' + o.kcmc + '</dd>' +
							'			</dl>' +
							'			<dl>' +
							'				<dt>任课教师</dt><dd>' + o.rkjs + '</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-info">' +
							'			<dl class="info-number">' +
							'				<dt>成绩</dt><dd>无成绩</dd>' +
							'			</dl>' +
							'		</div>' +
							'		<div class="XiuKao-link">';
                    if (data.bkshow == "1") {
                        html += '			<div class="btn-right">' +
							'				<button type="button" class="btn-primary btn-small" ' + bkdis + ' onclick=show_add("' + o.kcbh + '","' + o.kcmc + '","3","' + o.bjid + '")>缓考选课</button>' +
							'			</div>';
                    }
                    html += '		</div>' +
							'	</div>' +
							'</li>';

                })
                $('#ul_kc').html(html);
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                $.messager.alert("提示", msg, "error");
            }
        });
    }

    function GetList_sq() {
        var head = '<tr class="head">'+
					'	<td class="order"></td>'+
					'	<td>课程名称</td>'+
					'	<td>申请类型</td>' +
                    '	<td>申请学期</td>' +
					'	<td>申请时间</td>'+
					'	<td>申请理由</td>'+
//                    '    <td>原考试时间</td>'+
//                    '    <td>重缓/补考时间</td>' +
                    '    <td>重修/缓考申请班级</td>' +
                    '    <td>状态</td>'+
					'	<td class="operate">操作</td>'+
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_sqjl tbody').empty();
        $('#td_sqjl tbody').append(head);
        $.ajax({
            url: "cxhkbksq_sqjl",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                $.each(data, function (i, o) {
                    var ykssj = "", sqkssj = "";
                    if (o.ykssj)
                        ykssj = o.ykssj;
                    if (o.sqkssj)
                        sqkssj = o.sqkssj;
                    var tr = '';
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';

                    tr += '      <td class="order">' + (i + 1) + '</td>' +
                       '         <td>' + o.kcmc + '</td>' +
                       '         <td>' + o.sqlxmc + '</td>' +
                       '         <td>' + o.termname + '</td>' +
                       '         <td>' + o.sqsj + '</td>' +
                       '         <td>' + o.sqyy + '</td>' +
//                       '         <td>' + ykssj + '</td>' +
//                       '         <td>' + sqkssj + '</td>' +
                       '         <td>' + o.bjmc + '</td>' +
                       '         <td>' + o.shlmc + '</td>' +
                       '         <td>';
                    if (!o.dqzt || o.dqzt == "" || o.dqzt == "0") {
                        tr += '      <a class="btn-link" onclick=show_edit("' + o.kcbh + '","' + o.kcmc + '","' + o.sqlx + '","' + o.id + '",\'' + o.sqyy.replace("\n","") + '\',"' + ykssj + '","' + sqkssj + '","' + o.bjid + '")><span class="icon icon-edit"></span>编辑</a>' +
                       '             <a class="btn-link" onclick=row_del("' + o.id + '")><span class="icon icon-delete"></span>取消</a>';
                    }
                    tr += '         </td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_sqjl tbody').append(tr);
                })
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                $.messager.alert("提示", msg, "error");
            }
        });
    }

    function show_add(kcbh, kcmc, sqlx, bjid) {
        if (sqlx == "1") {
            $("#drp_kkbj").combobox({
                url: 'cxbkbksq_bindkkbj?kcbh=' + kcbh,
                valueField: 'bjid',
                textField: 'bjmc'
            });
            $("#kkbjtr").css("display", "");
        }
        else {
            $("#drp_kkbj").combobox({

            });
            $("#kkbjtr").css("display", "none");
        }
        if (sqlx == "2")
            $("#hktr").css("display", "");
        else
            $("#hktr").css("display", "none");
        $('#w').window({
            width: 500,
            title: '新增',
            modal: true
        });
        $('#w').window('open');
        $('#w').window('center');
        $("#kcbh").val(kcbh);
        $("#kcmc").html(kcmc);
        $("#sqlx").combobox("setValue", sqlx);
        $("#hfid").val("0");
        $("#bjid").val(bjid);
    }


    function show_edit(kcbh, kcmc, sqlx, id, sqyy, ykssj, sqkssj, bjid) {
        if (sqlx == "1") {
            $("#drp_kkbj").combobox({
                url: 'cxbkbksq_bindkkbj?kcbh=' + kcbh,
                valueField: 'bjid',
                textField: 'bjmc',
                value: bjid
            });
            $("#kkbjtr").css("display", "");
        }
        else {
            $("#drp_kkbj").combobox({

            });
            $("#kkbjtr").css("display", "none");
        }
        if (sqlx == "2")
            $("#hktr").css("display", "");
        else
            $("#hktr").css("display", "none");
        $('#w').window({
            width: 500,
            title: '编辑',
            modal: true
        });
        $('#w').window('open');
        $('#w').window('center');
        $("#kcbh").val(kcbh);
        $("#kcmc").html(kcmc);
        $("#sqlx").combobox("setValue", sqlx);
        $("#sqyy").textbox("setValue", sqyy);
        $("#ykssj").datebox("setValue", ykssj);
        $("#sqkssj").datebox("setValue", sqkssj);
        $("#bjid").val(bjid);
        $("#hfid").val(id);
    }

    function submitForm() {
        var isValid = $("#ff").form('enableValidation').form('validate');
        if (!isValid) {
            $.messager.progress('close');
            return isValid;
        }
        var info = new Object();
        info.kcbh = $('#kcbh').val();
        info.sqyy = $('#sqyy').textbox("getValue");
        info.sqlx = $('#sqlx').combobox("getValue");
        info.ykssj = $('#ykssj').datebox("getValue");
        info.sqkssj = $('#sqkssj').datebox("getValue");
        if (info.sqlx == "2" || info.sqlx == "3")
            info.bjid = $("#bjid").val();
        else
            info.bjid = $("#drp_kkbj").combobox('getValue');
        info.id = $('#hfid').val();
        var jsonObject = JSON.stringify(info);
//        $("#ff").ajaxSubmit({
//            url: "cxhkbksq_edit_save",
//            dataType: "json",
//            data: { 'json': jsonObject },
//            type: "post",
//            success: function (data) {
//                if (data.msg) {
//                    $.messager.alert("提示", "保存失败:" + data.msg, "error");
//                }
//                else {
//                    if (data.zt != "0") {
//                        $('#w').window('close')
//                        $.messager.alert("提示", "保存成功");
//                        GetList_sq();
//                        GetList();
//                    }
//                    else {
//                        $.messager.alert("提示", "保存失败", "error");
//                    }
//                }
//            },
//            error: function (e) {
//                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
//            }
//        });
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "cxhkbksq_edit_save",
            data: { 'json': jsonObject },
            cache: false,
            success: function (data) {
                if (data.msg) {
                    $.messager.alert("提示", "保存失败:" + data.msg, "error");
                }
                else {
                    if (data.zt != "0") {
                        $('#w').window('close')
                        $.messager.alert("提示", "保存成功");
                        GetList_sq();
                        GetList();
                    }
                    else {
                        $.messager.alert("提示", "保存失败", "error");
                    }
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function row_del(id) {
        $.messager.confirm("提示", "你确定要取消吗?", function (r) {
            if (r) {
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    url: "cxhkbksq_del",
                    data: { 'id': id },
                    cache: false,
                    success: function (data) {
                        if (data.msg) {
                            $.messager.alert("提示", "取消失败:" + data.msg, "error");
                        }
                        else {
                            if (data.zt != "0") {
                                $.messager.alert("提示", "取消成功");
                                GetList();
                                GetList_sq();
                            }
                            else {
                                $.messager.alert("提示", "取消失败", "error");
                            }
                        }
                    },
                    error: function (e) {
                        var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
                    }
                });
            } 
        });
    }
</script>
