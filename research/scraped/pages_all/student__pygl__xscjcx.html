<body>
    <div>
      
<script type="text/javascript">
    var sfzy = "1";
    $(function () {
        GetList();
        if (sfzy == "0" && "1" == "1")
            openxzcj();
    })

    function GetList() {
        $('#dg_xwk').datagrid({
            width: 'auto',
            height: '380px',
            scrollbarSize: 0,
            queryParams: {},
            loadMsg: '正在加载....',
            columns: [[
                { field: 'kcmc', title: '课程', width: 120 },
                { field: 'kcxf', title: '学分', width: 80 },
                { field: 'xxxq', title: '学期', width: 80 },
                { field: 'cj', title: '成绩', width: 80 }
            ]],
            pagination: false, //分页控件
            fitColumns: true,
            striped: true,
            rownumbers: false, //行号
            singleSelect: true, //是否单选
            onLoadSuccess: function (data) {
                var s = $("#dg_xwk").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            }
        });

        $('#dg_fxwk').datagrid({
            width: 'auto',
            height: '380px',
            scrollbarSize: 0,
            queryParams: {},
            loadMsg: '正在加载....',
            columns: [[
                { field: 'kcmc', title: '课程', width: 120 },
                { field: 'kcxf', title: '学分', width: 80 },
                { field: 'xxxq', title: '学期', width: 80 },
                { field: 'cj', title: '成绩', width: 80 }
            ]],
            pagination: false, //分页控件
            fitColumns: true,
            striped: true,
            rownumbers: false, //行号
            singleSelect: true, //是否单选
            onLoadSuccess: function (data) {
                var s = $("#dg_fxwk").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            }
        });

        $('#dg_pyhj').datagrid({
            width: 'auto',
            height: '380px',
            scrollbarSize: 0,
            queryParams: {},
            loadMsg: '正在加载....',
            columns: [[
                { field: 'pyhjmc', title: '课程', width: 120 },
                { field: 'xf', title: '学分', width: 80 },
                { field: 'xxxq', title: '学期', width: 80 },
                {
                    field: 'cj', title: '成绩', width: 80, formatter: function (value, row, index) {
                        if (row.pyhjdm == "Com501" && row.cj >= 60) {
                            return"通过"
                        }
                        if (row.pyhjdm == "Com501" && row.cj <60) {
                            return "不通过"
                        }

                        if (row.pyhjdm == "Com602" && row.cj >= 60) {
                            return "通过"
                        }
                        if (row.pyhjdm == "Com602" && row.cj < 60) {
                            return "不通过"
                        }

                        if (row.pyhjdm == "Com502" && row.cj >= 60) {
                            return "通过"
                        }
                        if (row.pyhjdm == "Com502" && row.cj < 60) {
                            return "不通过"
                        }

                        return row.cj >= 60 ? "通过" : "不通过";

                    }
                }
            ]],
            pagination: false, //分页控件
            fitColumns: true,
            striped: true,
            rownumbers: false, //行号
            singleSelect: true, //是否单选
            onLoadSuccess: function (data) {
                var s = $("#dg_fxwk").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            }
        });
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: 'xscjcx_list',
            cache: false,
            success: function (json) {
                $('#dg_xwk').datagrid('loadData', json.xwklist);
                $('#dg_fxwk').datagrid('loadData', json.fxwklist);
                $('#dg_pyhj').datagrid('loadData', json.hjcjlist);
                var xftj = json.xftj[0];
                var hjzxf = parseFloat(json.hjzxf);
                $("#xwxf").html((xftj.xwxf == null ? "0" : xftj.xwxf) + '学分');
                $("#fxwxf").html((xftj.fxwxf == null ? "0" : xftj.fxwxf) + '学分');
                $("#zxf").html((xftj.zxf == null ? "0" : xftj.zxf + hjzxf) + '学分');
                $("#yxxwxf").html((xftj.yxxwxf == null ? "0" : xftj.yxxwxf) + '学分');
                $("#yxfxwxf").html((xftj.yxfxwxf == null ? "0" : xftj.yxfxwxf) + '学分');
                $("#yxzxf").html((xftj.yxzxf == null ? "0" : xftj.yxzxf) + '学分');
                $("#faxwxf").html((xftj.faxwxf == null ? "0" : xftj.faxwxf) + '学分');
                $("#fazxf").html((xftj.fazxf == null ? "0" : xftj.fazxf) + '学分');
                $("#xwkgpa").html((xftj.xwkgpa == null ? "0" : xftj.xwkgpa));
                $("#zfgpa").html((xftj.zfgpa == null ? "0" : xftj.zfgpa));
                if (xftj.xwxf < xftj.yxxwxf)
                    $("#xwxf").css("color", 'red');
                if (xftj.fxwxf < xftj.yxfxwxf)
                    $("#fxwxf").css('color', 'red');
                if (xftj.zxf < xftj.yxzxf)
                    $("#zxf").css('color', 'red');
            }
        });
    }


    function dcword() {
        var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
        $("body").append(form); //将表单放置在web中
        form.attr("action", "dcword_cj");
        form.submit();
        $("#exportToExcelForm").remove();
    }



    function doprint() {
        var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
        $("body").append(form); //将表单放置在web中
        form.attr("action", "dcword_cj");
        form.submit();
        $("#exportToExcelForm").remove();
    }



    function openxzcj() {
        $('#dg2').datagrid({
            width: 'auto',
            height: '380px',
            scrollbarSize: 0,
            url: 'xscjcx_cjzylist',
            loadMsg: '正在加载....',
            columns: [[
                { field: 'xh', title: '学号', width: 80 },
                { field: 'kcbh', title: '课程编号', width: 80 },
                { field: 'kcmc', title: '课程名称', width: 100 },
                { field: 'kcxf', title: '学分', width: 80 },
                {
                    field: 'xwk', title: '选课类型', width: 80, formatter: function (value, row, index) {
                        return value == "1" ? "学位课" : "非学位课";
                    }
                },
                {
                    field: 'cj', title: '成绩', width: 80, formatter: function (value, row, index) {
                        return row.cjdjmc || value;
                    }
                },
                { field: 'lrsj', title: '获得成绩时间', width: 80 },
                {
                    field: 'sfzy', title: '是否转移', width: 80, formatter: function (value, row, index) {
                        if (value == 0)
                            return "否";
                        else
                            return "是";
                    }
                },
                {
                    field: 'action', title: '操作', width: 100, formatter: function (value, row, index) {
                        if (row.sfzy == 0)
                            return '<button id="btnprint" type="button" class="btn-samll floatleft" onclick="zycjdo(\'' + index + '\',\'1\')">转移</button>';
                        else
                            return '<button id="btnprint" type="button" class="btn-samll floatleft" onclick="zycjdo(\'' + index + '\',\'0\')">撤回转移</button>';
                    }
                }
            ]],
            pagination: false, //分页控件
            fitColumns: true,
            striped: true,
            rownumbers: false, //行号
            singleSelect: true, //是否单选
            onLoadSuccess: function (data) {
                var s = $("#dg_xwk").datagrid('getPanel');
                var rows = s.find('tr.datagrid-row');
                rows.unbind('click').bind('click', function (e) {
                    return false;
                });
            }
        });
        $("#otherWin").window({
            modal: true,
            width: 800,
            height: 500,
            maximizable: false,
            minimizable: false,
            title: '学分转换选择'
        });
        $("#otherWin").window("open");
    }

    function zycjdo(rowindex, type) {
        var row = $("#dg2").datagrid('getRows')[rowindex];
        var yqxh = row.xh;
        var cjid = row.cjid;
        var confirmmsg = "";
        if (type == "1")
            confirmmsg = "确定将" + yqxh + "学号下的成绩转入当前学号？";
        else
            confirmmsg = "确定撤回已经转移的成绩？";
        $.messager.confirm("确认提示", confirmmsg, function (isok) {
            if (isok) {
                $.ajax({
                    type: 'get',
                    dataType: "json", //返回json格式的数据
                    url: "xscjcx_cjzydo",
                    cache: false,
                    data: { "id": cjid, "type": type },
                    success: function (data) {
                        if (data.sign == "1") {
                            $('#dg2').datagrid('reload');
                            GetList();
                        }
                        else {
                            $.messager.alert("提示", data.msg, "error");
                        }
                    },
                    error: function (e) {
                        var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
                    }
                });
            }
        });
    }
</script>
<div class="Slayout">

                    <button id="btnprint" type="button" class="btn-primary floatleft" onclick="openxzcj()">
                        学分转换
                    </button>
            </div>
            <div class="tabs_content">
                <div class="row marginbottom30">
                    <div class="col-md-4">
                        <div class="T_view">
                            <div class="T_title">

                            </div>

                    <div class="col-md-4">
                        <div class="T_view hidden">

                            </div>

                        <div class="T_view hidden">

                                        </td>

                                        </td>

                                        </td>

                                            要求最低学位学分 ：
                                        </td>
                                        <td align="left" width="18%">
                                            &nbsp;&nbsp;<span id="faxwxf"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td height="25" align="right" class="bg">
                                            已修非学位学分 ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="fxwxf"></span>
                                        </td>
                                        <td align="right" class="bg">
                                            应修非学位学分 ：
                                        </td>
                                        <td align="left" colspan="3">
                                            &nbsp;&nbsp;<span id="yxfxwxf"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td height="25" align="right" class="bg">
                                            总学分（含培养环节学分） ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="zxf"></span>
                                        </td>
                                        <td align="right" class="bg">
                                            应修总学分 ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="yxzxf"></span>
                                        </td>
                                        <td align="right" class="bg">
                                            要求最低总学分 ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="fazxf"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td height="25" align="right" class="bg">
                                            学位gpa ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="xwkgpa"></span>
                                        </td>
                                        <td align="right" class="bg">
                                            总gpa ：
                                        </td>
                                        <td align="left">
                                            &nbsp;&nbsp;<span id="zfgpa"></span>
                                        </td>
                                        <td>
                                        </td>
                                        <td align="left">
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <table id="dg2"></table>
</div>
