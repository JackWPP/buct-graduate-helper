<body>
    <div>
      
<script type="text/javascript">
    $(function () {
        GetList();
        GetList_sq();
    });

    function GetList() {
        $.ajax({
            url: "pypgsq_list",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                var html = "";
                $.each(data.rows, function (i, o) {
                    var kssj = "&nbsp;";
                    var jzsj = "&nbsp;";
                    var je = "&nbsp;";
                    if (o.kssj)
                        kssj = o.kssj;
                    if (o.jzsj)
                        jzsj = o.jzsj;
                    if (o.je)
                        je = o.je;
                    html += '<li>' +
					'		<div class="column5-group">' +
					'			<img src="../../images/title-img0' + (i + 1) + '.png" alt="">' +
					'			<div class="Appraising-title">' + o.xmmc + '</div>' +
					'			<div class="Appraising-info">' +
					'				<dl>' +
					'					<dt>开始时间</dt>' +
					'					<dd>' + kssj + '</dd>' +
					'					<dt>截止时间</dt>' +
					'					<dd>' + jzsj + '</dd>' +
					'					<dt>奖励金额</dt>' +
					'					<dd>' + je + '</dd>' +
					'				</dl>' +
                    '			</div>' +
					'			<a href="pypgsq_edit?xmdm=' + o.xmdm + '" class="Appraising-link">申请</a>' +
					'		</div>' +
					'	</li>';

                })
                $('#xmlist').html(html);
            }
        });
    }

    function GetList_sq() {
        var head = '<tr class="head">' +
				   ' 	<td class="order"></td>' +
				   '	<td>名称</td>' +
				   '	<td>金额</td>' +
					'	<td>申请时间</td>' +
                    '    <td>审核状态</td>' +
                    '    <td>审核时间</td>' +
					'	<td class="operate">操作</td>' +
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_sqjl tbody').empty();
        $('#td_sqjl tbody').append(head);
        $.ajax({
            url: "pypgsq_sqlist",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                $.each(data.rows, function (i, o) {
                    var url = "pypgsq_edit?id=" + o.id;
                    var shlmc = "";
                    if (o.shlmc)
                        shlmc = o.shlmc;
                    else
                        shlmc = "未提交";
                    var shsj = "";
                    if (o.shsj)
                        shsj = o.shsj;
                    var tr = '';
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';

                    tr += '      <td class="order">' + (i + 1) + '</td>' +
                       '         <td>' + o.xmmc + '</td>' +
                       '         <td>' + o.je + '</td>' +
                       '         <td>' + o.sqsj + '</td>' +
                       '         <td>' + shlmc + '</td>' +
                       '         <td>' + shsj + '</td>' +
                       '         <td><a href="' + url + '" class="btn-link" ><span class="icon icon-magnifier"></span>查看</a></td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_sqjl tbody').append(tr);
                })
            }
        });
    }
</script>

<div class="Slayout">
		<div class="container">

						</div>

							</ul>

					</div>
				</div>
				<div class="col-md-12">

							<h3 class="panel1-title">历史记录</h3>
						</div>
						<div class="panel1-body">
							<table class="listtable" id="td_sqjl">
								<tbody></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
