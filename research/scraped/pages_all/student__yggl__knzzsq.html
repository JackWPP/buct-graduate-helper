                    row.flag = "edit";
                }
                $("#dg_plxzrdcy").datagrid("refreshRow", index);
            },
            onCancelEdit:function(index,row){
                 row.flag=undefined;
                 dg_plxzrdcy_edit_index=undefined;
                 $('#dg_plxzrdcy').datagrid('refreshRow', index);

    function onIniteData() {
        var sqid=$("#sqid").val();
        $.post("knzzsq_xsjbxx",{id:sqid}, function (data) {
            var xjdata = data.xj[0];
            var sqdata = data.sq;
            shlxx(data.shjl);
            $.each(xjdata, function (key, value) {
                var htmlobj = $("#" + key);
                if (htmlobj.length > 0) {
                    if(value!=null)
                    {
                      htmlobj.text(value);
                    }
                }
            });
            if(sqdata!=null)
            {
                $("#hklb").combobox('setValue',sqdata.hklb);
                $("#jtzrk").val(sqdata.jtzrk);
                $("#jtnsr").val(sqdata.jtnsr);
                $("#rjysr").val(sqdata.rjysr);
                $("#kndc").val(sqdata.kndc);
                $("#tfsj").textbox('setValue',sqdata.tfsj);
                $("#jlzz").textbox('setValue',sqdata.jlzz);
                var jtlxarray=sqdata.jtlx.split(',');
                $("#jtlx").checkboxlist('setvalue',jtlxarray);
            }
        }, "json");
    }
    function jtcy_reload() {
        var sqid = $("#sqid").val();
        $("#dg_jtcy").datagrid('reload', { sqid: sqid });
    }
    function add_jtcy(flag) {
        var jtcyobj = {};
        var id = "";
        var index = undefined;
        var jtcyobj = {};
        if (flag == "1") {
            index = dg_jtcy_index;
        }
        else {
            var row = $("#dg_jtcy").datagrid('getRows')[dg_jtcy_edit_index];
            id = row.id;
            index = dg_jtcy_edit_index;
        }
        if (index != undefined) {
            var sqid = $("#sqid").val();
            var cw_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'cw' });
            var xm_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'xm' });
            var nl_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'nl' });
            var hyzk_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'hyzk' });
            var jkzk_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'jkzk' });
            var jyzk_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'jyzk' });
            var gzdw_target=$("#dg_jtcy").datagrid('getEditor',{index:index,field:'gzdw'});
            var nsr_target = $("#dg_jtcy").datagrid('getEditor', { index: index, field: 'nsr' });
            jtcyobj.id = id;
            jtcyobj.knzzid = sqid;
            jtcyobj.cw = $(cw_target.target).textbox('getValue');
            jtcyobj.xm = $(xm_target.target).textbox('getValue');
            jtcyobj.nl = $(nl_target.target).textbox('getValue');
            jtcyobj.hyzk = $(hyzk_target.target).textbox('getValue');
            jtcyobj.jkzk = $(jkzk_target.target).textbox('getValue');
            jtcyobj.jyzk = $(jyzk_target.target).textbox('getValue');
            jtcyobj.gzdw=$(gzdw_target.target).textbox('getValue');
            jtcyobj.nsr = $(nsr_target.target).textbox('getValue');
        }
        if (jtcyobj.cw == "") {
            $.messager.alert("提示", "称谓不能为空！", "error");
            return;
        }
        if (jtcyobj.xm == "") {
            $.messager.alert("提示", "姓名不能为空！", "error");
            return;
        }
        if (jtcyobj.jkzk == "") {
            $.messager.alert("提示", "健康状况不能为空！", "error");
            return;
        }
        if (jtcyobj.jyzk == "") {
            $.messager.alert("提示", "就业状况不能为空！", "error");
            return;
        }
        var tipmsg = "";
        if (id == "") {
            tipmsg = "添加";
        }
        else {
            tipmsg = "更新";
        }
        $.post("knzzsq_addjtcy", jtcyobj, function (data) {
            if (data.sign == "1") {
                var sqid = data.sqid;
                dg_jtcy_index = undefined;
                dg_jtcy_edit_index = undefined;
                $("#sqid").val(sqid);
                jtcy_reload();
            }
            else {
                $.messager.alert("提示", tipmsg + "失败", "error");
            }
        }, "json");
    }
    function dg_jtcy_delete(index){
        $.messager.confirm("提示","确定删除？",function(isok){
            if(isok){
                var row=$("#dg_jtcy").datagrid('getRows')[index];
                var id=row.id;
                $.post("knzzsq_deletejtcy",{ids:id},function(data){
                    if(data=="1")
                    {
                        $.messager.alert("提示","已删除","info");
                        jtcy_reload();
                    }
                    else
                    {
                        $.messager.alert("提示","删除失败！","error");
                    }
                },'json');
            }
        })
    }

        {

    {
        if(sign=="1")
        {
            $.messager.confirm("提示","提交后无法更改，确定要提交？",function(isok){
                 if(isok)
                 {
                     knzz_sq_save(sign); 
                 }
            });
        }
        else
        {
            knzz_sq_save(sign);

    function knzz_sq_save(sign)
    {
        var msg="";
        if(sign=="1")
        {
            msg="提交";
        }
        else
        {
            msg="保存";
        }
        var kbzz_sq_obj={};
        kbzz_sq_obj.xh=$("#xh").text();
        kbzz_sq_obj.hklb=$("#hklb").combobox('getValue');
        kbzz_sq_obj.jtzrk=$("#jtzrk").val();
        kbzz_sq_obj.jtnsr=$("#jtnsr").val();
        kbzz_sq_obj.rjysr=$("#rjysr").val();
        kbzz_sq_obj.kndc=$("#kndc").val();
        kbzz_sq_obj.tfsj=$("#tfsj").textbox('getValue');
        kbzz_sq_obj.jlzz=$("#jlzz").textbox('getValue');
        kbzz_sq_obj.id=$("#sqid").val();
        kbzz_sq_obj.sign=sign;
        var jtlxObjArray=$(".jtlx:checked");
        var jtlxarray=[];
        $.each(jtlxObjArray,function(index,item){
            jtlxarray.push($(item).val());
        });
        kbzz_sq_obj.jtlx=jtlxarray.join(",");
        if(kbzz_sq_obj.hklb=="")
        {
            $.messager.alert("提示","户口类别未选择！","error");
            return;
        }
        if(kbzz_sq_obj.jtzrk=="")
        {
            $.messager.alert("提示","家庭总人口不能为空！","error");
            return;
        }
        if(kbzz_sq_obj.jtnsr=="")
        {
            $.messager.alert("提示","全家年总收入不能为空！","error");
            return;
        }
        if(kbzz_sq_obj.rjysr=="")
        {
            $.messager.alert("提示","人均月收入不能为空！","error");
            return;
        }
        if(kbzz_sq_obj.jtlx=="")
        {
            $.messager.alert("提示","家庭类型未选择！","error");
            return;
        }
        $.post("kbzz_sq_objadd",kbzz_sq_obj,function(data){
            if(data.sign=="1")
            {
                if(sign=="1")
                {
                   location.reload();
                }
                $("#sqid").val(data.sqid);
                $.messager.alert("提示",msg+"成功！","info");
            }
            else
            {
                if(data.msg=="")
                {
                $.messager.alert("提示",msg+"失败！","error");
                }
                else
                {
                $.messager.alert("提示",data.msg,"error");
                }
            }
        },"json");
    }
    function shlxx(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';

                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {

                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {

                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                  '  </li>';
        })
        $("#step_sm").html(html);
    }
</script>
