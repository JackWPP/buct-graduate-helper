<script type="text/javascript">
    var groups = "";
    $(function () {
        groups = "";
        getcity();
//        var userid = '';
//        alert(userid);
    });
    function getcity() {
        //        var province = returnCitySN.province;
        var city = returnCitySN.cname;
        $("#hfcity").val(city);
    }
    function loginform() {
        $("#btnlogin").attr("disabled", "disabled");
        var info = new Object();
        info.UserId = $("#UserId").val();
        var p = $("#Password").val();
        var rsa = new JSEncrypt();
        var pubkey = $("#pubkey").val();
        rsa.setPublicKey(pubkey);
        var rsa_p = rsa.encrypt(p);
        info.Password = rsa_p;
        info.VeriCode = $("#VeriCode").val();
        info.city = $("#hfcity").val();
        info.url = $("#hfgoto").val();
        var jsonObject = JSON.stringify(info);
        $.ajax({
            type: 'post',
            url: "login_do",
            dataType: "json", //返回json格式的数据
            data: { 'json': jsonObject },
            cache: false,
            success: function (data) {
                if (data.jg == "1") {
                    document.location = "../" + data.url;
                }
                else if (data.jg == "2") {
                    var grouphtml = '';
                    $.each(data.group, function (i, o) {
                        grouphtml += '<div style="padding-left:50px; padding-top:10px;">';
                        if (i == 0) {
                            grouphtml += '<input id="' + o.groupcode + '" type="radio" name="rdogroup" value="' + o.groupcode + '" checked="checked"/>';
                        } else {
                            grouphtml += '<input id="' + o.groupcode + '" type="radio" name="rdogroup" value="' + o.groupcode + '"/>';
                        }
                        grouphtml += '<label for="' + o.groupcode + '">' + o.groupdesc + '</label></div>';
                    });
                    $("#groupbox").html(grouphtml);
                    show_grouplist();
                }
                else {
                    $('#imgVerifi').attr('src', '/Home/VerificationCode' + '?t=' + new Date().getSeconds());
                    $.messager.alert("提示", data.msg, "error");
                }
                $("#btnlogin").attr("disabled", false);
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                $.messager.alert("提示", msg, "error");
            }
        });
    }
    window.onkeypress = function () {
        if (event.keyCode == 13) {
            if (groups == "1") {
                document.getElementById('btn_groupok').click();
            }
        }
    }
    function changecode() {
        $('#imgVerifi').attr('src', '/Home/VerificationCode' + '?t=' + new Date().getTime());
    }

    function show_grouplist() {
        groups = "1";
        $("#w_group").window({
            modal: true,
            width: 400,
            height: 'auto'
        });
        $('#w_group').window('open');
        $("#w_group").window('center');
    }

    function sel_group() {
        var group = $('input:radio[name=rdogroup]:checked').val();
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: 'index_selgroup',
            data: { 'group': group },
            cache: false,
            success: function (data) {
                if (data.zt == "1") {
                    document.location = '/home/index';
                }
                else {
                    $.messager.alert("提示", data.msg);
                }
            }
        });
    }
    function responseTextTitle(responseText) {
        var index1 = responseText.indexOf("<title>");
        var index2 = responseText.indexOf("</title>");
        return responseText.substring(index1 + 7, index2);
    }
</script>
