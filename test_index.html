        function loginout() {

        //初始化菜单
        function getMenu() {
            $.ajax({

                url: "MenuleftInfo",
                cache: false,
                success: function (Data) {
                    onIniteMenue(Data);
                }
            });

        function onIniteMenue(data) {
            var menuestr = "";
            if (data && data.menus && data.menus.length > 0) {
                $.each(data.menus, function (index, item) {
                    var itemmenue = "";
                    var icon = item.icon;

                    itemmenue = "<div class=\"nav\"><a href=\"javascript:void(0)\"><span class=\"" + icon + " icon18\"></span>" + item.menuname + "<span class=\"right\"></span></a>";
                    if (item.menus.length > 0) {
                        itemmenue += "<ul class=\"subnav\" style=\"display:none\">";
                        $.each(item.menus, function (index, iteminfo) {
                            itemmenue += "<li><a href=\"" + iteminfo.url + "\" target=\"mainFrame\">" + iteminfo.menuname + "</a></li>";
                        })
                        itemmenue += "</ul>";
                    }
                    itemmenue += "</div>";
                    menuestr += itemmenue;
                });
            }
            else {
                menuestr = "<div class=\"nav\"><a href=\"javascript:void(0)\"><span class=\"icon-user icon18\"></span>个人管理<span class=\"right\"></span></a></div>"
                menuestr += "<div class=\"nav\"><a href=\"javascript:void(0)\"><span class=\"icon-peiyang icon18\"></span>培养管理<span class=\"right\"></span></div>"
                menuestr += "<div class=\"nav\"><a href=\"javascript:void(0)\"><span class=\"icon-xuewei icon18\"></span>毕业与学位<span class=\"right\"></span></a></div>"
            }
            $("#nav_box").html(menuestr);
            addleftMenueEvent();
        }
        function addleftMenueEvent() {
            $(".nav .subnav").prev().click(function () {
                var classvalue = $(this).attr("class");
                var allsubnav = $(".nav .subnav");
                var allnava = $(".nav .subnav").prev();
                allnava.removeAttr("class");
                allsubnav.slideUp();
                var ulobj = $(this).next();
                if (ulobj) {
                    if (classvalue == "current") {
                        ulobj.slideUp();
                        $(this).removeAttr("class")
                    }
                    else {
                        ulobj.slideDown();
                        $(this).attr({ "class": "current" });
                    }
                }
            });
            $(".nav .subnav a").click(function () {
                var currentobj = $(this);
                $(".nav .subnav a").removeAttr("class");
                currentobj.attr({ "class": "current" });
                var ejcd = currentobj.parents(".subnav").prev().text();
                var sjcd = currentobj.text();
            })
        }

            }, "text");
            var framedocument = document.getElementById("mainFrame").contentWindow.document;
            var parentdocument = parent.document;
            $(parentdocument).bind('click', documentClick);
            $(framedocument).bind('click', documentClick);
        }
        function documentClick(e) {
            var e = e || window.event;
            var elem = e.target || e.srcElement;
            while (elem) {
                if (elem.className && (elem.className.indexOf('popover-photo') > -1 || elem.className.indexOf('nav-link') > -1)) {
                    return;
                }
                elem = elem.parentNode;
            }
            parent.$('.popover-photo').css('display', 'none');
        }

<div id="google_translate_element" style="position:absolute;bottom:10px;right:10px;z-index:2000;opacity:0.7;"></div>
<script type="text/javascript">
    $(function () {
        $("#google_translate_element").hide();
        //var currentLanguage = getCookie("googtrans");
        var currentLanguage = $.cookie('googtrans');
        if (currentLanguage)
            $("[name='languageSelector']").val(currentLanguage);
        setTimeout(function () { $("body").css("top", "0px"); }, 500);
    });

    function languageSelectChange() {
        //document.cookie = "googtrans=" + $("[name='languageSelector']").val() + ";domain=" + languageSelector_domain + ";path=/";
        $.cookie('googtrans', $("[name='languageSelector']").val());
        $.cookie('domain', languageSelector_domain);
        $.cookie('path', "/");
        location.reload();
    }


    //读取cookies
    function getCookie(name) {
        var arr, reg = new RegExp("(^| )" + name + "=([^;]*)(;|$)");

        if (arr = document.cookie.match(reg))

            return unescape(arr[2]);
        else
            return null;
    }

    function googleTranslateElementInit() {
        new google.translate.TranslateElement(
            {
                pageLanguage: 'zh-CN',
                includedLanguages: 'en,zh-CN',
                autoDisplay: false,
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            },
            'google_translate_element'
        );
    }
</script>
