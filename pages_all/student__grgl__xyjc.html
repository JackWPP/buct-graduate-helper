<body>
    <div>
      
<script type="text/javascript" language="javascript">
    $(function () {
        showwelcomData();
        getxyjcinfo();
    });

    function showwelcomData() {
        $.post("../default/getwelcomdata", function (data) {
            if(data.sys.dz1!=""){
                $("#dz1").attr("href",data.sys.dz1);
            }
            if(data.sys.dz2!=""){
                $("#dz2").attr("href",data.sys.dz2);
            }
            if(data.sys.dz3!=""){
                $("#dz3").attr("href",data.sys.dz3);
            }
        }, "json");
    }

    function getxyjcinfo() {
        $.post("getxyjcinfo", function (data) {
            var data = data.data;
            var html = "";
            var rowhtml = "<div class=\"row\">";
			var len=data.length;
			var rowIndex=0;
            $.each(data, function (index, item) {
                rowhtml += "<div class=\"col-md-3\"><div class=\"task_box\">";
                rowhtml += "<div class=\"task_title\"><span class=\"icon-" + item.bz + "\"+></span>" + item.mc + "</div>";
                rowhtml += "<div class=\"task_item\">";
                rowhtml += "<dl><dd>时间</dd><dt></dt>"+((item.sjsm==undefined||item.sjsm==null||item.sjsm=="")?"--":item.sjsm)+"</dl>";
                rowhtml += "<dl><dd style=\"height:60px;overflow-y:auto\">任务</dd><dt>" + ((item.rw == "" || item.rw == null) ? "--" : item.rw) + "</dt></dl>";
                if ((item.wcrq == undefined || item.wcrq == null || item.wcrq == "")&&(item.sfwc==undefined||item.sfwc==null||item.sfwc==""||item.sfwc=="0")) {
                    rowhtml += "<dl><dd></dd><dt><a href=\"javascript:void(0)\" onclick=\"beginxsyw('" + item.url + "')\"><button type=\"button\" class=\"btn-primary btn-small\">开始任务</button></dt></a></dl>";
                    rowhtml += "<dl><dd>说明</dd><dt style=\"height:102px;overflow-y:auto\">" + ((item.ywsm == "" || item.ywsm == null) ? "--" : item.ywsm) + "</dl>";
                    rowhtml += "<a href=\"javascript:void(0)\" class=\"task_links\" onclick=\"openywgz('"+item.lcdm+"')\">业务规则</a>";
                }
                rowhtml += "</div>";
                if ((item.wcrq != undefined && item.wcrq != null && item.wcrq != "")||(item.sfwc!=undefined&&item.sfwc!=null&&item.sfwc!=""&&item.sfwc!="0")) {
                    var wcrq=""
                    if(item.wcrq != undefined && item.wcrq != null && item.wcrq != "")
                    {
                        wcrq=item.wcrq;   
                    }
                    rowhtml += "<div class=\"task_item_done\"><table><tbody><tr><th>完成时间</th><td>" + (wcrq!=""?wcrq:"--") + "</td></tr></tbody></table></div>";
                    rowhtml +="<div class=\"task_done\"><img src=\"/Content/themes/student/images/task_done.png\"></div>";
                }
                rowhtml += "</div></div>";
				var cum=len%4;
				var rowlen=parseInt(len/4);  
                if (index % 4 == 3) {
                    html += rowhtml + "</div>"
                    rowhtml = "<div class=\"row\">";
					rowIndex++;
                }
				else if(rowIndex==rowlen && (index+1)%4==cum)
				{
					html += rowhtml + "</div>";
				}
            });
            var htmlobj = $(html);
            $("#xsywjc").append(htmlobj);
        }, "json");
    }
    function beginxsyw(url) {
        if(url!="")
        {
            url = '/' + url.replace('~/', '');
            var obj = parent.$("#mainFrame");
            obj[0].src = url;
        }
    }
    function openywgz(lcdm)
        {
            var width = $(window).width() * 0.8 + "px";
            parent.layer.open({
                type: 2,
                title: false,
                area: [width, '700px'],
                content: ['ywgz?lcdm='+lcdm+'&&isnext=no','no'],
                shadeClose: false,
                closeBtn: 2
            });
        }
</script>
<div class="Slayout">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<div id="xsywjc" class="mask_block">
						<div class="mask_title icon_xyrw">
							<span class="icon_xyre">你需要完成以下学业任务</span>
							<a href="#" class="title_more" style="display: none;">更多</a>
						</div>					
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<div class="mask_block">
						<div class="mask_title marginbottom10">
							<span class="icon_yqtt">友情提醒</span>
						</div>
						<div class="prompt">
							<p>请及时关注研究生管理系统提示的各项学业任务，及时掌握研究生学习进度。学习和系统使用过程中碰到任何问题，欢迎您积极咨询学院教学秘书、研究生院相关岗位工作人员，学校将竭诚为您服务。</p>
							<p>请确认个人信息手机填写正确，学业中各项业务提醒我们将通过手机短信方式通知到你。</p>
							<div>
								<a id="dz1" target="_blank" href="#">研究生院工作机构设置及联系电话</a>
								<a id="dz2" target="_blank" href="#">研究生办事指南</a>
								<a id="dz3" target="_blank" href="#">学院教学秘书及联系电话</a>
							</div>
							<div class="prompt_qita">
								
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
