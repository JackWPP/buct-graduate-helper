    function onInite() {
        var id = $("#hfid").val();
        $('#hfzjid').val("0");
        $.ajax({
            type: 'get',
            dataType: "json", //返回json格式的数据
            url: "xsktsq_edit_load",
            data: { 'id': id },
            cache: false,
            success: function (data) {
                if (data.sftkktsq == false) {
                    $('#btnsave').hide();
                    $('#btnsubmit').hide();
                    alert("论文开提申请还未通过");
                }
                var info = data.info;
                var sfht = info.sfht
                if (sfht =="是" || sfht=="否") {
                    $("input[name='sfht'][value=" + sfht + "]").attr("checked", true);
                }
                $('#cj').combobox({
                    panelHeight: 'auto',
                    width: 100,
                    data: data.ktcj,
                    editable: false,
                    valueField: 'dm',
                    textField: 'dmmc'
                });
                shlxx(data.shl);
                if (data.ktjl > 1) {
                    $("#ktjl").show();
                }
                $("#fjmc").html(info.fjmc)
                //$("#lwktsqsj").datebox(info.lwktsqsj)
                $('#ff').form('load', info);
                $.each($(".textarea"), function (i, o) {
                    var zddm = $(o).attr("zddm");
                    var zdnr = o.value;
                    $("#" + zddm).textbox("setValue", zdnr);
                })
                if (info.fjmc==null || info.fjmc == "") {
                    $("#sfscfj").text("");
                }
                else {
                    $("#sfscfj").text("已上传！");
                }
              

                GetList(); 
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function shlxx(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    shz = false;
                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    if (shz) {
                        html += '<div class="step_sm_item step_sm_processing"><span class="name">' + o.shlmc + '</span> <span class="time">审核中…</span>';
                        shz = false;
                    } else {
                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                  '  </li>';
        })
        $("#step_sm").html(html);
    }

    function getRowIndex(target) {

    function ktbg_save(zt) {

        //var hjfj = $('#hjfj').fi


        var form = $("#ff");
        var isValid = $("#ff").form('enableValidation').form('validate');
        if (!isValid) {
            $.messager.progress('close'); // hide progress bar while the form is invalid
            return isValid;
        }

        var info = $('#ff').serializeObject();
        if (info.lwksny == "") {
            $.messager.alert("提示", "请输入论文开始年月", "error");
            return;
        }
        if (info.lwjzny == "") {
            $.messager.alert("提示", "请输入论文截止年月", "error");
            return;
        }
        var zdxx = [];
        var nrlenght = 0;
        var msg = "";
        $.each($(".zdxx"), function (i, o) {
            var obj = new Object();
            obj.zddm = o.value;
            obj.zdlx = $(o).attr("zdlx");
            obj.zdmc = $(o).attr("zdmc");
            if (obj.zdlx == "editor") {
                obj.zdnr = UE.getEditor(obj.zddm).getContent();
                if (obj.zdnr.replace(/\s+/g,"") == "") {
                    msg += obj.zdmc + "不能为空;";
                }
                
//                UE.getEditor(obj.zddm).getKfContent(function (content) {
//                    //将公式转换为图片，回调函数
//                })
            }
            else if (obj.zdlx == "textarea") {
                obj.zdnr = $("#" + obj.zddm).textbox("getValue");
                $("#hf" + obj.zddm).val(obj.zdnr);
            }
            else if (obj.zdlx == "file") {
                obj.zdnr = $("#wjmc_" + obj.zddm).val();
            }
			if(obj.zdnr!=null && obj.zdnr.length>0)
			{
				nrlenght+=obj.zdnr.length;
			}
            zdxx.push(obj);
        })
        if (msg != "") {
            $.messager.alert("提示", msg, "error");
            return;
        }
        info.list_zdnr = zdxx;
        var lwtm = $('#txtlwtm').textbox('getValue');
        info.lwtm = lwtm;
        //var lwktsqsj = $('#lwktsqsj').datebox('getValue');
        //info.lwktsqsj = lwktsqsj;
        var tsxx = "保存";
        if (zt == "0")
            tsxx = "提交";
        var jsonObject = JSON.stringify(info);
        $("#ff").ajaxSubmit({
            method: 'post',
            url: "xsktsq_edit_save",
            dataType: "json",
            data: { 'json': jsonObject, 'zt': zt },
            cache: false,
            success: function (json) {
                if (json.jg == "0") {
                    if (json.msg) {
                        $.messager.alert("提示", json.msg, "error");
                    } else {
                        $.messager.alert("提示", tsxx + "出错", "error");
                    }
                }
                else if (json.jg == "1") {
                    $("#hfid").val(json.id);
                    onInite();
                    $.messager.alert("提示", tsxx + "成功");
                    //$('#btnsave').hide();
                    //$('#btnsubmit').hide();
                    //window.location.reload();
                }
                else if (json.jg == "2") {
                    window.location.reload();
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText);
                if (msg == "") {
                    $.messager.alert("提示", e.responseText, "error");
                }
                else {
                    $.messager.alert("提示", msg, "error");
                }
            }
        });
    }

    function print_word() {
        var id = $("#hfid").val();
        $.post("xsktsq_print", { "ischeck": "1", "id": id }, function (data) {
            if (data.sign == "0") {
                $.messager.alert("提示", data.msg, "error");
                return;
            }
            else {

                var formobj = $("<form id='form1' action='xsktsq_print' method='post'></from>");
                var inputType = $("<input type='hidden' value='word' name='type'/>");
                var inputid = $("<input type='hidden' value='" + id + "' name='id'/>");
                $("body").append(formobj);
                inputType.appendTo(formobj);
                inputid.appendTo(formobj);
                formobj.submit();
            }
        }, "json");
    }

function pyhj_xz(zddm) {
    var wjmc = $("#wjmc_" + zddm).val();
    $.ajax({
        type: 'get',
        url: "xsktsq_edit_checkwj",
        dataType: "json",
        data: {  'wjmc': wjmc },
        cache: false,
        success: function (data) {
            if (data.jg == "1") {
                var form = $("<form action=\"xsktsq_edit_xz\"></form>");
                var inputwjmc = $("<input type='hidden' value='" + wjmc + "' name='wjmc'/>");
              
                form.append(inputwjmc);
                $(document.body).append(form);
                form.submit();
            }
            else {
                $.messager.alert("提示", data.msg, "error");
            }

        },
        error: function (e) {
            $.messager.alert("提示", "出错" + e.toString(), "error");
        }
    });
}
