<body>
    <div>
      

<script type="text/javascript">
    $(function () {
        GetList();
    })

    function GetList() {
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            url: 'ttkcx_list',
            queryParams: { },
            loadMsg: '正在加载....',
            columns: [[
                { field: 'jsxm', title: '教师', width: 50, sortable: false },
                { field: 'bjmc', title: '班级', width: 100, sortable: true },
                { field: 'kcbh', title: '课程编号', width: 60, sortable: false },
                { field: 'kcmc', title: '课程名称', width: 100, sortable: false },
                { field: 'ydz', title: '原上课地点', width: 100, sortable: false },
                { field: 'dz', title: '调整上课地点', width: 100, sortable: false },
                { field: 'sj1', title: '原上课时间', width: 120, sortable: true,
                    formatter: function (value, row) {
                        var html = "";
                        if (row.yksz && row.yjsz)
                            html += row.yksz + '-' + row.yjsz + '周，';
                        if (row.yksxq && row.yjsxq)
                            html += '星期' + row.yksxq + '-星期' + row.yjsxq + '，';
                        if (row.yksjcmc && row.yjsjcmc)
                            html += row.yksjcmc + '-' + row.yjsjcmc;
                        return html;
                    }
                },
                { field: 'sj2', title: '调整上课时间', width: 120, sortable: true,
                    formatter: function (value, row) {
                        var html = "";
                        if (row.tzksz && row.tzjsz)
                            html += row.tzksz + '-' + row.tzjsz + '周，';
                        if (row.tzksxq && row.tzjsxq)
                            html += '星期' + row.tzksxq + '-星期' + row.tzjsxq + '，';
                        if (row.tzksjcmc && row.tzjsjcmc)
                            html += row.tzksjcmc + '-' + row.tzjsjcmc;
                        return html;
                    }
                }
            ]],
            pagination: true, //分页控件 
            fitColumns: true,
            striped: true,
            rownumbers: true, //行号
            singleSelect: false, //是否单选 
            onLoadSuccess: function (data) {

            }
        });
        //设置分页控件 
    }

    
</script>
<div class="Slayout">

            </div>

            </table>

    </div>
</div>
