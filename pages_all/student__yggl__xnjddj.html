<script type="text/javascript">
    $(function () {
        $.ajax({
            type: 'get',
            dataType: 'json',
            url: "xnjddj_load",
            data: {},
            cache: false,
            success: function (json) {
                var xsxx = json.xsxx;
                var xftj = json.xftj[0];
                $("#xh").html(xsxx.xh);
                $("#xm").html(xsxx.xm);
                $("#xsmc").html(xsxx.xsmc);
                $("#zymc").html(xsxx.zymc);
                $("#pycc").html(xsxx.pycc);
                $("#dsxm").html(xsxx.dsxm);
                $("#yxzxf").html(xftj.yxzxf);
                $("#zxf").html(xftj.zxf);
                getlist();
                $('#dg_lw').datagrid("loadData", json.lw);
                $('#dg_zz').datagrid("loadData", json.zz);
                $('#dg_jc').datagrid("loadData", json.jc);
                $('#dg_zl').datagrid("loadData", json.zl);
                $('#dg_hj').datagrid("loadData", json.hj);
                if (json.lw.length > 0)
                    $("#empty_lw").hide();
                if (json.zz.length > 0)
                    $("#empty_zz").hide();
                if (json.jc.length > 0)
                    $("#empty_jc").hide();
                if (json.zl.length > 0)
                    $("#empty_zl").hide();
                if (json.hj.length > 0)
                    $("#empty_hj").hide();
            }
        });

    });

    function getlist() {
        $('#dg_lw').datagrid({
            width: 'auto',
            height: 'auto',
            autoRowHeight: false,
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'lwmc', title: '名称', width: 200 },
                { field: 'zzpm', title: '作者排名', width: 100 },
                { field: 'kwmc', title: '期刊名称', width: 200 },
                { field: 'fbsj', title: '发表时间', width: 100 },
                { field: 'fblbmc', title: '等级', width: 100 }

            ]],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            singleSelect: false, //是否单选 
            onBeforeSelect: function () {
                return false;
            }
        });
        $('#dg_zz').datagrid({
            width: 'auto',
            height: 'auto',
            autoRowHeight: false,
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'zzjcmc', title: '名称', width: 200 },
                { field: 'zzpx', title: '作者排名', width: 100 },
                { field: 'cbsmc', title: '出版社名称', width: 200 },
                { field: 'cbsj', title: '出版时间', width: 100 },
                { field: 'skh', title: '书刊号', width: 100 }

            ]],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            singleSelect: false, //是否单选 
            onBeforeSelect: function () {
                return false;
            }
        });
        $('#dg_jc').datagrid({
            width: 'auto',
            height: 'auto',
            autoRowHeight: false,
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'zzjcmc', title: '名称', width: 200 },
                { field: 'zzpx', title: '作者排名', width: 100 },
                { field: 'cbsmc', title: '出版社名称', width: 200 },
                { field: 'cbsj', title: '出版时间', width: 100 },
                { field: 'skh', title: '书刊号', width: 100 }

            ]],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            singleSelect: false, //是否单选 
            onBeforeSelect: function () {
                return false;
            }
        });
        $('#dg_zl').datagrid({
            width: 'auto',
            height: 'auto',
            autoRowHeight: false,
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'zlh', title: '申请号', width: 200 },
                { field: 'pm', title: '作者排名', width: 100 },
                { field: 'zlmc', title: '专利名称', width: 200 },
                { field: 'sqny', title: '授权时间', width: 100 },
                { field: 'zllxmc', title: '专利类型', width: 100 }

            ]],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            singleSelect: false, //是否单选 
            onBeforeSelect: function () {
                return false;
            }
        });
        $('#dg_hj').datagrid({
            width: 'auto',
            height: 'auto',
            autoRowHeight: false,
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'jlmc', title: '获奖名称', width: 200 },
                { field: 'hjrq', title: '获奖时间', width: 100 },
                { field: 'bjdw', title: '奖励单位', width: 200 }

            ]],
            fitColumns: true,
            striped: true,
            pagination: false, //分页控件 
            rownumbers: false, //行号
            singleSelect: false, //是否单选 
            onBeforeSelect: function () {
                return false;
            }
        });
    }

    function dcword() {

        var form = $("<form id='exportToExcelForm' style='display:none' method='post'>"); //定义一个form表单
        $("body").append(form); //将表单放置在web中
        form.attr("action", "xnjddj_dcword");
        form.submit();
        $("#exportToExcelForm").remove();

    }
</script>
