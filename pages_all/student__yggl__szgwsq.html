<body>
    <div>
      
<style type="text/css">
      .textbox-focused input
       {
           box-shadow:0px 0px;
       }
</style>
<script type="text/javascript">
    $(function () {
        GetList();
        GetList_sq();
    });
    function GetList() {
        var head = '<tr class="head">' +
				   '	<td>岗位类别</td>' +
				   '	<td>设岗单位</td>' +
					'	<td>岗位名称</td>' +
                    '    <td>设岗人数</td>' +
                    '    <td>申请人数</td>' +
                    '    <td>岗位职责</td>' +
                    '    <td>联系人</td>' +
                    '    <td>联系电话</td>' +
                    '    <td>岗位开始时间</td>' +
                    '    <td>岗位结束时间</td>' +
                    '    <td>申请开始时间</td>' +
                    '    <td>申请截止时间</td>' +
					'	<td class="operate">操作</td>' +
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_gw tbody').empty();
        $('#td_gw tbody').append(head);
        var gwlb=$("#gwlb").combobox('getValue');
        $.ajax({
            url: "szgwsq_list",
            type: "get",
            dataType: "json",
            data: { "gwlb": gwlb },
            success: function (data) {
                if (data.rows.length == 0) {
                    var tr = "<tr class='odd'><td colspan='13'>暂未发布岗位</td></tr>";
                    $('#td_gw tbody').append(tr);
                    return;
                }
                $.each(data.rows, function (i, o) {
                    var gwkssj = "&nbsp;";
                    var gwjssj = "&nbsp;";
                    var sgrs = "";
                    if (o.gwkssj)
                        gwkssj = o.gwkssj;
                    if (o.gwjssj)
                        gwjssj = o.gwjssj;
                    if (o.sgrs)
                        sgrs = o.sgrs;
                    var tr = '';
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';

                    tr += '      <td>' + o.gwlbmc + '</td>' +
                       '         <td>' + o.bmmc + '</td>' +
                       '         <td>' + o.gwmc + '</td>' +
                       '         <td>' + sgrs + '</td>' +
                       '         <td>' + o.sqrs + '</td>' +
                       '         <td>' + o.gwzz + '</td>' +
                       '         <td>' + o.lxr + '</td>' +
                       '         <td>' + o.lxdh + '</td>' +
                       '         <td>' + gwkssj + '</td>' +
                       '         <td>' + gwjssj + '</td>' +
                       '         <td>' + o.sqkssj + '</td>' +
                       '         <td>' + o.sqjzsj + '</td>' +
                       '         <td><a href="javascript:void(0)" class="btn-link" onclick=show_add("' + o.id + '","' + o.gwmc + '")><span class="icon icon-edit"></span>申请</a></td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_gw tbody').append(tr);

                })
            }
        });
    }

    function GetList_sq() {
        var head = '<tr class="head">' +
				   '	<td>岗位名称</td>' +
					'	<td>申请时间</td>' +
                    '    <td>审核状态</td>' +
                    '    <td>提交/审核时间</td>' +
                    '    <td>在岗状态</td>' +
					'	<td class="operate" style="width:200px">操作</td>' +
					'	<td class="foot"></td>' +
					'</tr>';
        $('#td_sqjl tbody').empty();
        $('#td_sqjl tbody').append(head);
        $.ajax({
            url: "szgwsq_sqlist",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                $.each(data.rows, function (i, o) {
                    var url = "szgwsq_edit?id=" + o.id;
                    var shlmc = "";
                    if (o.shlmc)
                        shlmc = o.shlmc;
                    else
                        shlmc = "未提交";
                    var shsj = "";
                    if (o.shsj)
                        shsj = o.shsj;
                    var tr = '';
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';

                    tr += '      <td>' + o.gwmc + '</td>' +
                       '         <td>' + o.sqsj + '</td>' +
                       '         <td>' + shlmc + '</td>' +
                       '         <td>' + shsj + '</td>' +
                       '         <td>' + o.zgzt + '</td>';
                    if (o.dqzt == "") {
                        tr += '         <td><a href="javascript:void(0)" class="btn-link" onclick=show_edit("' + o.id + '","' + o.gwid + '","' + o.gwmc + '","' + o.sqly + '","' + o.xggzjl + '","' + o.hjqk + '")><span class="icon icon-edit"></span>编辑</a>' +
                            '             <a href="javascript:void(0)" class="btn-link" onclick=row_del("' + o.id + '")><span class="icon icon-delete"></span>删除</a>';
                    }
                    if (o.dqzt == "0") { //审核未提交可撤销
                        tr += '         <td><a href="javascript:void(0)" class="btn-link" onclick=row_repeal("' + o.id + '","' + o.xh + '")><span class="icon icon-return"></span>撤销申请</a>';
                    }
                    tr += '</td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_sqjl tbody').append(tr);
                })
            }
        });
    }

    function row_del(id) {
        $.messager.confirm("提示", "确定要删除？", function (isok) {
            if (isok) {
                $.post("szgwsq_delete", { "id": id }, function (data) {
                    if (data.zt == "1") {
                        $.messager.alert("提示", "已删除！", "info");
                        GetList_sq();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }, "json");
            }
        })
    }

    //撤销
    function row_repeal(id,xh) {
        $.messager.confirm("提示", "确定要撤销吗？", function (isok) {
            if (isok) {
                var ids = [];
                var obj = new Object();
                obj.ywbid = id;
                obj.xh = xh;
                ids.push(obj);
                var idjson = JSON.stringify(ids);//data: { 'json': idjson, 'shzt': shzt, 'dotype': dotype },
                $.post("szgwsq_repeal", { 'json': idjson, "id": id }, function (data) {
                    if (data.zt == "1") {
                        $.messager.alert("提示", "已撤销！", "info");
                        GetList_sq();
                    }
                    else {
                        $.messager.alert("提示", data.msg, "error");
                    }
                }, "json");
            }
        })
    }


    function show_add(gwid, gwmc) {
        $('#w').window({
            width: 600,
            title: '新增',
            modal: true
        });
        $('#w').window('open');
        $('#w').window('center');
        $("#gwid").val(gwid);
        $("#gwmc").html(gwmc);
        $("#sqly").textbox("setValue", "");
        $("#xggzjl").textbox("setValue", "");
        $("#hjqk").textbox("setValue", "");
        $("#hfid").val("0");
    }

    function show_edit(id, gwid, gwmc, sqly, xggzjl, hjqk) {
        
        $('#w').window({
            width: 600,
            title: '编辑',
            modal: true
        });
        $('#w').window('open');
        $('#w').window('center');
        $("#gwid").val(gwid);
        $("#gwmc").html(gwmc);
        $("#sqly").textbox("setValue", sqly);
        $("#xggzjl").textbox("setValue", xggzjl);
        $("#hjqk").textbox("setValue", hjqk);
        $("#hfid").val(id);
    }

    function submitForm(dotype) {
        var isValid = $("#ff").form('enableValidation').form('validate');
        if (!isValid) {
            $.messager.progress('close');
            return isValid;
        }
        var alertmsg = "保存";
        if (dotype == "1") {
            alertmsg = "提交";
        }
        var info = new Object();
        info.gwid = $('#gwid').val();
        info.sqly = $('#sqly').textbox("getValue");
        info.xggzjl = $('#xggzjl').textbox("getValue");
        info.hjqk = $('#hjqk').textbox("getValue");
        
        info.id = $('#hfid').val();
        var jsonObject = JSON.stringify(info);
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "szgwsq_save",
            data: { 'json': jsonObject, zt: dotype },
            cache: false,
            success: function (data) {
                if (data.msg) {
                    $.messager.alert("提示", alertmsg + "失败:" + data.msg, "error");
                }
                else {
                    if (data.zt != "0") {
                        if (dotype == "1") {
                            $('#w').window('close');
                        }
                        else {
                            $('#w').window('setTitle', '编辑');
                        }
                        $('#hfid').val(data.id);
                        $.messager.alert("提示", alertmsg + "成功");
                        GetList();
                        GetList_sq();
                    }
                    else {
                        $.messager.alert("提示", alertmsg + "失败", "error");
                    }
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function tjszxx() {
        $.messager.confirm("提示", "提交后无法改动，确定提交！", function (isok) {
            if (isok) {
                submitForm("1");
            }
        })
    }
    function lb_onSelect(rec) {
        GetList();
    }
</script>
<div class="Slayout">
	<div class="container">
        <div class="row-inline">
            <div class="col-md-12">
				<div class="panel1 panel1-default">
					<div class="panel1-head">
						<h3 class="panel1-title">三助岗位申请（三助类别:<input id="gwlb" class="easyui-combobox" data-options="editable:false,height:'34px',width:'80px',url:'szgwsq_bindszlb',valueField:'dm',textField:'dmmc',onSelect:lb_onSelect"/>
)</h3>
					</div>
					<div class="panel1-body">
						<table class="listtable" id="td_gw">
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
			<div class="col-md-12">
				<div class="panel1 panel1-default">
					<div class="panel1-head">
						<h3 class="panel1-title">申请记录</h3>
					</div>
					<div class="panel1-body">
						<table class="listtable" id="td_sqjl">
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<div id="w" class="easyui-window" title="编辑" data-options="modal:true,closed:true">
    <form id="ff" method="post">
    <input id="hfid" name="id" type="hidden" />
    <table class="basictable">
        <tr>
            <td style="width: 150px;" class="bg">
                申请岗位：
            </td>
            <td class="tdright">
                <input id="gwid" type="hidden" name="gwid" />
                <span id="gwmc"></span>
            </td>
        </tr>
        <tr id="kkbjtr">
            <td style="width: 150px;height:40px" class="bg">
                申请理由：
            </td>
            <td class="tdright">
               <input id="sqly" type="text" name="sqly" class="easyui-textbox" data-options="multiline:true"
                    style="width: 400px; height: 50px" />
            </td>
        </tr>
        <tr>
            <td class="bg">
                相关工作经历：
            </td>
            <td class="tdright">
                <input id="xggzjl" type="text" name="xggzjl" class="easyui-textbox" data-options="multiline:true"
                    style="width: 400px; height: 50px" />
            </td>
        </tr>
        <tr>
            <td class="bg">
                获奖情况：
            </td>
            <td class="tdright">
                <input id="hjqk" type="text" name="hjqk" class="easyui-textbox" data-options="multiline:true"
                    style="width: 400px; height: 50px" />
            </td>
        </tr>
        <tr>
            <td colspan="2" align="right">
                <button id="btnok" type="button" class="but-primary" onclick="submitForm()"><span class="icon icon-finish"></span>保存</button>
                <button id="btnok" type="button" class="but-primary" onclick="tjszxx()"><span class="icon icon-finish"></span>提交</button>
                
            </td>
        </tr>
    </table>
    </form>
</div>
    </div>

</body>
