<script type="text/javascript">
    var tkjs=[];
    $(function () {
        $.ajax({
            url: "wskscp_load",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                tkjs[0] = data.sj1;
                tkjs[1] = data.sj2;
                tkjs[2] = data.sj3;
                tkjs[3] = data.sj4;
                showsjinfo(0, 0);
                showsjinfo(1, 0);
                showsjinfo(2, 0);
                showsjinfo(3, 0);
            }
        });
        $.ajax({
            url: "wskscp_list",
            type: "get",
            dataType: "json",
            data: {},
            success: function (data) {
                $.each(data, function (i, o) {
                    var tr = '';
                    if (i % 2 == 0)
                        tr = '<tr class="odd">';
                    else
                        tr = '<tr class="even">';
                    var kstg = o.kstg=='1'?'通过':'未通过';
                    
                    tr += '         <td class="order">' + (i + 1) + '</td>' +
                       '         <td>' + o.tkjmc + '</td>' +
                        '         <td>' + o.sjmc + '</td>' +
                       //'         <td>' + o.tkmc + '</td>' +
                       '         <td>' + o.kksj + '</td>' +
                       '         <td>' + o.ksys + '分钟</td>' +
                       '         <td>' + kstg + ' <span>' + o.kscj + '</span></td>' +
                       '         <td class="foot"></td>' +
                       '     </tr>';
                    $('#td_ksjl tbody').append(tr);
                })
            }
        });
    })
    //    <a href="#" class="btn-link"><span class="icon icon-magnifier"></span>查看</a>
    //切换试卷
    function showsjinfo(tkjindex,num) {
        var sjindex = parseInt($("#hidindex" + tkjindex).val());
        if (sjindex == 0 && num < 0)
            return;
        sjindex += num;
        var info = tkjs[tkjindex];
        if (sjindex==0) {
            $("#btnleft" + tkjindex).addClass("disabled");
        }
        else {
            $("#btnleft" + tkjindex).removeClass("disabled");
        }
        if (info.length - 1 <= sjindex) {
            $("#btnright" + tkjindex).addClass("disabled");
        }
        else {
            $("#btnright" + tkjindex).removeClass("disabled");
        }
        if (info.length >= sjindex + 1) {
            $("#hidindex" + tkjindex).val(sjindex);
            $("#sjid" + tkjindex).val(info[sjindex].sjid);
            $("#sjmc" + tkjindex).html(info[sjindex].sjmc);
            $("#dtsj" + tkjindex).html(info[sjindex].dtsj + "分钟");
            $("#kssj" + tkjindex).html(info[sjindex].kssj);
            $("#jssj" + tkjindex).html(info[sjindex].jssj);
            if (info[sjindex].sycs == -1)
                $("#sycs" + tkjindex).html("无限制");
            else
                $("#sycs" + tkjindex).html(info[sjindex].sycs);
        }
    }


    function ksks(tkjindex) {
        var sjindex = parseInt($("#hidindex" + tkjindex).val());
        var sjid = $("#sjid" + tkjindex).val();
        if (!sjid || sjid == "") {
            $.messager.alert("提示", "请选择试卷", "error");
            return;
        }
        if (tkjindex == "0" || tkjindex == "1") {
            document.location = "wskscp_ks?sjid=" + sjid;
        }
        else {
            document.location = "wskscp_wj?sjid=" + sjid;
        }
    }
</script>
