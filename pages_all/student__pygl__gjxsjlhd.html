<script type="text/javascript">
    $(function () {
        //GetList();
        pageload();
    });

    function pageload() {
        var search = document.location.search;
        var id = $("#hfid").val();
        if (id != "" && id != "0")
            search = "?id=" + id;

        $.ajax({
            type: 'get',
            dataType: 'json',
            url: "gjxsjlhd_load" + search,
            cache: true,
            success: function (data) {
                if (data.shl) {
                    if (data.shl.dqzt != "" && data.shl.dqzt_shlxx.sfkyxg != "1") {
                        $("#btnsubmit").hide();
                        $("#btnsave").hide();
                        //提交后将可操作为变灰
                        $('#hdlx').combobox({ disabled: true });
                        $('#xmmc').textbox({ disabled: true });
                        $('#kssj').datetimebox({ disabled: true });
                        $('#jssj').datetimebox({ disabled: true });
                        $('#hydd').textbox({ disabled: true });
                        $('#zbf').textbox({ disabled: true });
                        $('#zzje').textbox({ disabled: true });
                        //$("#lwtm").attr("disabled", true);
                        $("#hyyqclDiv").hide();
                        controlbtn();

                        
                    }
                }
                controlbtn1();
                if (data.shl_cl.dqzt != "" && data.shl_cl.dqzt_shlxx.sfkyxg != "1") {
                    $("#btnsubmit_cl").hide();
                    $("#btnsave_cl").hide();
                }
                //显示学生信息
                //var xsxx = data.xsxx[0];
                //$("#xh").html(xsxx.xh);
                //$("#xm").html(xsxx.xm);
                if (data.shjl) {
                    shlxx(data.shjl);
                }
                if (data.shjl1) {
                    shlxx1(data.shjl1);
                }
                
                $('#hdlx').combobox({
                    panelHeight: 'auto',
                    data: data.hdlxlist,
                    editable: false,
                    valueField: 'dm',
                    textField: 'dmmc'
                });

                //申请表存在信息
                if (data.model != undefined && data.model != null) {
                    $('#ff').form("load", data.model);
                    var dsje = "未录入";
                    var yxjtje = "未录入";
                    if (data.model.dsjtje != 0)
                        dsje = data.model.dsjtje;
                    if (data.model.yxjtje != 0)
                        yxjtje = data.model.yxjtje;
                    $("#dsjtje").html(dsje);
                    $("#yxjtje").html(yxjtje);
                    //$('#kssj').datetimebox('setValue', data.model.kssj);
                    //$('#jssj').datetimebox('setValue', data.model.jssj);
                    controlbtn();

                }
            }
        });
    }

    function shlxx(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    shz = false;
                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    if (shz) {
                        html += '<div class="step_sm_item step_sm_processing"><span class="name">' + o.shlmc + '</span> <span class="time">审核中…</span>';
                        shz = false;
                    } else {
                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                '  </li>';
        })
        $("#step_sm").html(html);
    }

    
    function shlxx1(shl) {
        var html = "";
        var shz = true; //审核中
        $.each(shl, function (i, o) {
            html += '<li class="step_sm_done">';
            if (o.shljb == "0") {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    shz = false;
                    html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待提交…</span>';
                }
            }
            else {
                if (o.shsj != "")
                    html += '<div class="step_sm_item step_sm_success"><span class="name">' + o.shlmc + '</span> <span class="time">' + o.shsj + '</span>';
                else {
                    if (shz) {
                        html += '<div class="step_sm_item step_sm_processing"><span class="name">' + o.shlmc + '</span> <span class="time">审核中…</span>';
                        shz = false;
                    } else {
                        html += '<div class="step_sm_item step_sm_future"><span class="name">' + o.shlmc + '</span> <span class="time">等待审核…</span>';
                    }
                }
            }
            html += '      </div>' +
                '  </li>';
        })
        $("#step_sm1").html(html);
    }
    //保存和提交
    function btn_save(zt) {
        var info = $('#ff').serializeObject();
        info.xh=2026201060;
        info.xmmc = $('#xmmc').textbox("getValue");
        info.kssj = $('#kssj').datetimebox("getValue");
        info.jssj = $('#jssj').datetimebox("getValue");
        info.hydd = $('#hydd').textbox("getValue");
        info.zbf = $('#zbf').textbox("getValue");
        info.zzje = $('#zzje').textbox("getValue");
        if (info.zzje !== null && info.zzje != "" && info.zzje != undefined) {
            var regPos = /^\d+(.\d+)*$/;
            if (!regPos.test(info.zzje)) {
                $.messager.alert("提示", "金额为数字！", "error");
                return;
            }
        } else {

            info.zzje = 0;
        }
      
        
        if (info.xmmc == "") {
            $.messager.alert("提示", "请输入项目名称！", "error");
            return;
        }
        if (info.kssj == "") {
            $.messager.alert("提示", "请选择开始时间！", "error");
            return;
        }
        if (info.jssj == "") {
            $.messager.alert("提示", "请选择结束时间！", "error");
            return;
        }
        if (info.hydd == "") {
            $.messager.alert("提示", "请输入地点（院校）！", "error");
            return;
        }
        if (info.zbf == "") {
            $.messager.alert("提示", "请输入主办方！", "error");
            return;
        }
        if (info.zjje == "") {
            $.messager.alert("提示", "请输入资助金额！", "error");
            return;
        }
        if (info.hbjltm == "") {
            $.messager.alert("提示", "请输入口头汇报/墙报题目！", "error");
            return;
        }

        if (info.id == "") {
            info.id = "0";
        }
        var tsxx = "保存";
        if (zt == "0")
            tsxx = "提交";
        var jsonObject = JSON.stringify(info);
        pageloadms("请稍候。。。");
        $('#ff').ajaxSubmit({
            type: 'post',
            url: "gjxsjlhd_save",
            dataType: "json",
            data: { 'json': jsonObject, 'zt': zt },
            cache: false,
            success: function (json) {
                if (json.zt == "0") {
                    $.messager.alert("提示", json.msg, "error");
                }
                else if (json.zt == "1") {
                    $("#hfid").val(json.id);
                    $.messager.alert("提示", tsxx + "成功");
                    pageload();
                }
                dispageload();
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }


    //下载
    function controlbtn() {
        var id = $("#hfid").val();
        if (id != "0") {
            $.post("getpy_gjxsjlhdinfo", { id: id }, function (data) {
                if (data.tjgccjd != "") {
                    $("#Downhyyqcl").text("已上传，下载").attr("href", "hyyqcl_down?id=" + id + "&date=" + new Date().getMilliseconds());
                }

            }, 'json');
        }
    }

    //下载
    function controlbtn1() {
        var id = $("#hfid").val();
        if (id != "0") {
            $.post("getpy_gjxsjlhdcltjinfo", { id: id }, function (data) {
                if (data.tjgccjd != "") {
                    $("#Downbxcl").text("已上传，下载").attr("href", "gjhybxcl_down?id=" + id + "&date=" + new Date().getMilliseconds());
                }

            }, 'json');
        }
    }


    //保存和提交
    function btn_savecl(zt) {
        var info = $('#ff').serializeObject();
        info.xh =2026201060;

        


        if (info.id == "") {
            info.id = "0";
        }
        var tsxx = "保存";
        if (zt == "0")
            tsxx = "提交";
        var jsonObject = JSON.stringify(info);
        pageloadms("请稍候。。。");
        $('#ff').ajaxSubmit({
            type: 'post',
            url: "gjxsjlhdcltj_save",
            dataType: "json",
            data: { 'json': jsonObject, 'zt': zt },
            cache: false,
            success: function (json) {
                if (json.zt == "0") {
                    $.messager.alert("提示", json.msg, "error");
                }
                else if (json.zt == "1") {
                    $("#hfid").val(json.id);
                    $.messager.alert("提示", tsxx + "成功");
                    pageload();
                }
                dispageload();
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }
</script>
