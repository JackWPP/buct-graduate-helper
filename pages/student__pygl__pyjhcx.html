<body>
    <div>
      
<script type="text/javascript">
    $(function () {
        loadFormData();
    }); 
    var kkxq = [{ "dm": "1", "dmmc": "1" }, { "dm": "2", "dmmc": "2" }, { "dm": "3", "dmmc": "3" }, { "dm": "4", "dmmc": "4" }, { "dm": "5", "dmmc": "5" }, { "dm": "6", "dmmc": "6"}];
    function loadFormData() {
        var search = document.location.search;
        $.ajax({
            type: 'post',
            dataType: "json", //返回json格式的数据
            url: "pyjhcxlist",
            data: {},
            cache: false,
            success: function (data) {
                var info = data.info;
                $("#xwk_count").html(info.xwk_count);
                $("#fxwk_count").html(info.fxwk_count);
                $("#xwk_xf").html(info.xwk_xf);
                $("#fxwk_xf").html(info.fxwk_xf);
                $("#xwxf").html(info.xwxf);
                $("#zxf").html(info.zxf);
                $("#zgxf").html(info.zgxf);
                GetList();
                $('#dg').datagrid('loadData', data.pyjh);

                var shzt = info.shzt;
                if (shzt==null || shzt == "" || shzt == "0") {
                    //未审核通过不能打印计划
                    $("#lnksubmit").attr("style", "display:none;");
                }
            },
            error: function (e) {
                var msg = responseTextTitle(e.responseText); $.messager.alert("提示", msg, "error");
            }
        });
    }

    function GetList() {
        var search = document.location.search;
        $('#dg').datagrid({
            width: 'auto',
            height: 'auto',
            scrollbarSize: 0,
            queryParams: {},
            columns: [[
                { field: 'kcbh', title: '课程编号', width: 100, sortable: false },
                { field: 'kcmc', title: '课程名称', width: 120, sortable: false },
                { field: 'kclbmc', title: '课程类别', width: 80, sortable: false },
                { field: 'xwk', title: xwknames.title, width: 80, sortable: false,
                    formatter: function (value, row, index) {
                        return value == '1' ? xwknames.xwk : xwknames.fxwk;
                    }
                },
                { field: 'kcxf', title: '学分', width: 40, sortable: false },
                { field: 'kczxs', title: '学时', width: 40, sortable: false },
                { field: 'xxxq', title: '学期', width: 40, align: 'center' }
            ]],
            nowrap: false,
            fitColumns: true,
            striped: true,
            rownumbers: false, //行号
            singleSelect: true, //是否单选 
            onLoadError: function (e) {
                $.messager.alert("提示", "加载失败", "error");
            },
            onLoadSuccess: function (data) {

            }
        });
    }
    function doprint() {
        $.post("pyjhdy", { sfcheck: "1" }, function (data) {
            if (data.sign == "1") {
                var form = $("<form action=\"pyjhdy\"></form>");
                $(document.body).append(form);
                form.submit();
            }
            else {
                $.messager.alert("提示", data.msg, "error");
            }
        }, "json");
    }
    function dolzlgprint() {
        $.post("pyjhdy_lzlg", { sfcheck: "1" }, function (data) {
            if (data.sign == "1") {
                var form = $("<form action=\"pyjhdy_lzlg\"></form>");
                $(document.body).append(form);
                form.submit();
            }
            else {
                $.messager.alert("提示", data.msg, "error");
            }
        }, "json");
    }
    function dotjcjprint() {
        $.post("pyjhdy_tjcj", { sfcheck: "1" }, function (data) {
            if (data.sign == "1") {
                var form = $("<form action=\"pyjhdy_tjcj\"></form>");
                $(document.body).append(form);
                form.submit();
            }
            else {
                $.messager.alert("提示", data.msg, "error");
            }
        }, "json");
    }
</script>
<div class="Slayout">

        <div class="layout_box">
            <div class="Operating_area">
                当前学位课:<span id="xwk_count"></span>门,<span id="xwk_xf"></span>学分 非学位课:<span id="fxwk_count"></span>门,<span
                                id="fxwk_xf"></span>学分 <span id="zyzdyq" style="color: Red;">本专业最低要求(学位分:<span id="xwxf"></span>
                                    总学分:<span id="zxf"></span> 最高学分:<span id="zgxf"></span>)</span>

                                           <button id="lnksubmit" type="button" class="btn-primary floatright" onclick="doprint()" >打印</button>


                
            </div>
            <table id="dg">
            </table>
